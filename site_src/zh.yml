Thermodynamics and generative AI: 热力学与生成式人工智能
Can thermodynamics improve learning and sampling?: 热力学如何帮助优化学习与采样？
Building on stochastic and finite-time thermodynamics, this direction explores how low-dissipation protocols and optimal control can improve learning and sampling in generative AI, including diffusion models and Transformers.: 将随机热力学与有限时间热力学的方法和优化工具应用于生成式人工智能，探索以低耗散方案和最优控制改进学习与采样，面向扩散模型与变换器模型。
Stochastic thermodynamics · Finite-time optimization · Generative AI: 随机热力学 · 有限时间优化 · 生成式人工智能
A further research direction is to apply methods and optimization tools from stochastic and finite-time thermodynamics to generative AI, with the aim of improving learning and sampling in diffusion models and Transformers.: 另一个研究方向是将随机热力学与有限时间热力学的方法和优化工具应用于生成式人工智能，探索如何改进扩散模型与变换器模型中的学习和采样过程。
