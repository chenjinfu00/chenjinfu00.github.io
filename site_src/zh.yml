Preparation, fluctuations and optimization in quantum and nonequilibrium systems: 量子与非平衡系统的制备、涨落与优化
Quantum thermodynamics: 量子热力学
Finite-time and stochastic thermodynamics: 有限时间和随机热力学
Finite-time & stochastic: 有限时间和随机热力学
Research topics: 研究标签
Nonlocality & many-body: 量子非局域性和量子多体系统
Finite-time driving incurs an energy cost, and limited measurements constrain what can be inferred about quantum correlations. These three research directions address those constraints through thermodynamic geometry, quantum dynamics, and many-body symmetry.: 有限时间内驱动系统需要付出能量代价，有限的测量数据也会约束对量子关联的判断。这三个方向分别从热力学几何、量子动力学和多体对称性出发，研究如何在这些约束下设计控制和检验方案。
Finite-time thermodynamics, optimal control, and fluctuations: 有限时间热力学、最优控制与涨落
How do finite-time driving and fluctuations shape the cost of a process?: 有限时间驱动和涨落如何影响过程的能量代价？
Shortening the duration of a process typically increases the excess work required to drive it. Thermodynamic length sets a lower bound on this work and can be estimated from finite-time measurements. For shortcuts to isothermality, a geodesic in the space of control parameters gives a minimum-cost protocol. The same geometric approach applies to membrane separation of gas mixtures: 缩短操作时间通常需要付出更多额外功。热力学长度为这部分功给出了下界，也可以利用有限时间测量来估计。在等温捷径框架下，最小能耗的调控方式对应控制参数空间中的一条测地线。这套几何方法也用于混合气体的膜分离
When individual strokes form a heat-engine cycle, their energy cost limits the output power of the engine. Shortcuts to isothermality give an attainable power bound for Brownian engines operated in this way. Optimal control also identifies the maximum-power cycle when the available control parameters are constrained: 当单个冲程连成热机循环时，各冲程的耗散会限制整台热机的输出功率。等温捷径给出了这类布朗热机循环可达到的功率上界。当控制参数的可调范围有限时，最优控制可以确定最大功率对应的循环
The cost of faster driving also depends on the system. Across a first-order transition, system size can change how excess work scales with the driving rate. In individual realizations, work and heat also fluctuate. Including both energy and momentum transfer in their definitions gives fluctuation theorems that apply when the system and its heat bath move relative to each other: 加快驱动的代价也取决于系统本身。跨越一阶相变时，系统尺寸会改变额外功随驱动速率的标度。在单次过程中，功和热还会发生涨落。把能量与动量的传递都纳入功和热的定义后，涨落定理也适用于系统与热浴相对运动的情形
State preparation: 量子态制备
Many-body state preparation and open-system dynamics: 量子多体态制备与开放系统动力学
How can quantum states be prepared faster?: 如何更快制备目标量子态？
Adiabatic preparation starts from a state that is easy to produce and gradually changes the controls until the system reaches the target state. Driving too quickly can trigger unwanted transitions. Quantum geometry guides the choice of driving protocol, while changing the Hamiltonian without changing the target state can widen the smallest energy gap along the preparation path: 绝热制备从容易获得的初态出发，通过逐步改变控制参数使系统到达目标态。驱动过快容易引发非绝热跃迁。量子几何为选择调控方式提供了依据。在保持目标态的条件下调整哈密顿量，还可以增大制备路径上的最小能隙
Coupling a system to its environment provides another route when the target is a thermal state. The coupling can be designed to speed up the slowest relaxation process while preserving the target equilibrium. The dynamics of a driven open system can also be formulated to describe the fluctuations in the work done by the drive and in the heat exchanged with the environment: 当目标是制备热态时，系统与环境的耦合提供了另一条途径。通过设计这种耦合，可以保持目标热平衡态，同时加快最慢的弛豫过程。同一类开放系统动力学还可以描述外部驱动做的功、系统与环境交换的热，以及这两者的涨落
Bell correlations: 贝尔关联
Multipartite Bell correlations from limited measurements: 有限测量下的多体贝尔关联验证
Can few-body correlations reveal many-body nonlocality?: 怎样用少体关联检验多体非局域性？
As the number of measurement parties grows, enumerating the facets of the local polytope becomes impractical. The search for tight Bell inequalities can be formulated as an optimization of the ratio of the quantum value to the classical bound. A nondegenerate local maximum of that ratio gives a facet inequality, providing a way to construct tests without enumerating all facets: 随着测量方增多，局域多面体的面迅速增多，逐一枚举变得困难。寻找紧贝尔不等式可以转化为优化量子值与经典上界之比。这个比值的非退化局部极大点对应局域多面体的一个面，因此可以通过优化来构造判据
The next constraint is how many correlations an experiment can measure. Permutation symmetry allows the inequalities to be built from one- and two-body correlations alone. Semidefinite programming certifies the quantum violations in the large-system limit, making these inequalities suitable for testing multipartite nonlocality using low-order correlations: 判据还需要能用实际可取得的数据检验。利用测量方之间的置换对称性，可以构造只依赖一体和二体关联的不等式。其在大系统极限下的量子违背可由半定规划认证，为通过少体关联检验多体非局域性提供了一条途径
