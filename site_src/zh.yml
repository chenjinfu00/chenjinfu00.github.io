Fundamental questions.: 追问基本问题。
From the limits of classical correlations to faster thermalization and more efficient control, I study what quantum systems can do, and how to make them do it.: 从超越经典的量子关联，到更快的热化与更高效的控制，我关注量子系统能够实现什么，以及如何实现。
Quantum nonlocality: 量子非局域性
What makes quantum correlations different?: 量子关联为何与众不同？
Symmetry and polyhedral optimization help turn multipartite Bell inequalities into noise-robust, experimentally feasible tests of correlations beyond classical physics.: 利用对称性与多面体优化，构建抗噪声、易于实验实现的多体贝尔不等式检验，探索超越经典物理的关联。
Bell inequalities · Symmetry · Optimization: 贝尔不等式 · 对称性 · 优化
Many-body thermalization: 多体系统热化
How quickly can a quantum system relax?: 量子系统能多快达到平衡？
By shaping dissipation and optimizing Lindbladian spectral gaps, I develop ways to prepare thermal states faster. Tensor networks make these questions accessible beyond small systems.: 通过设计耗散过程、优化 林德布拉德生成元 谱隙，寻找更快制备多体热态的途径，并借助张量网络研究规模更大的量子系统。
Open systems · Spectral gaps · Tensor networks: 开放系统 · 谱隙 · 张量网络
Thermodynamic geometry: 热力学几何
How much does it cost to go faster?: 更快的操作，需要多大代价？
Geometric methods identify low-dissipation control protocols, revealing how finite operating time limits the power and efficiency of quantum and Brownian heat engines.: 利用几何方法寻找低耗散控制方案，揭示有限操作时间如何限制量子热机与布朗热机的功率和效率。
Finite-time control · Geometry · Heat engines: 有限时间控制 · 几何 · 热机
Fluctuations & learning: 涨落与学习
What can fluctuations tell us?: 随机涨落中藏着什么规律？
I study the statistics of heat and work in small systems, and am exploring how stochastic thermodynamics can help analyze learning and sampling, with applications in diffusion models and Transformers.: 研究微小系统中热与功的统计规律，并探索以随机热力学分析学习和采样过程，应用于扩散模型与 变换器模型。
Fluctuation relations · Stochastic processes · Generative AI: 涨落关系 · 随机过程 · 生成式人工智能
