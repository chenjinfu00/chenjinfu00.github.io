Jinfu Chen, theoretical physicist at Leiden University. Quantum nonlocality, many-body thermalization, thermodynamic geometry, and stochastic thermodynamics.: 陈劲夫，莱顿大学理论物理研究者，关注量子非局域性、多体热化、热力学几何与随机热力学。
Understanding, controlling, and optimizing quantum systems. Research by Jinfu Chen at Leiden University.: 理解、控制与优化量子系统。莱顿大学陈劲夫的研究主页。
Pause animation: 暂停动画
Designing the coupling to an environment offers a way to prepare many-body thermal states faster while preserving the target equilibrium state.: 通过设计系统与环境的耦合，在不改变目标平衡态的前提下，加快多体热态的制备。
Optimizing spectral gaps along a preparation path helps reduce the bottlenecks that make adiabatic quantum-state preparation slow.: 沿态制备路径优化谱隙，缓解限制绝热演化速度的瓶颈。
A geometric bound quantifies the extra energy needed for fast membrane separation and identifies paths that reduce that cost.: 用几何界限量化快速膜分离的额外能耗，并找到降低这一代价的操作路径。
Systematic optimization helps identify multipartite Bell tests with stronger quantum violations, supporting the search for experimentally useful nonlocality witnesses.: 系统优化多体贝尔检验中的量子违背，为寻找实验上有用的非局域性判据提供支持。
Finite-duration measurements can estimate thermodynamic length, making a quantity that bounds dissipation accessible without infinitely slow experiments.: 通过有限时间的测量估计热力学长度，无需无限缓慢的实验，也能获得约束耗散的关键量。
Shows that a finite-time quantum Otto engine can outperform standard maximum-power benchmarks.: 揭示有限时间量子奥托热机的最大功率效率可以超越常用基准。
Shows what continuous monitoring changes, and what it preserves, in mesoscopic transport.: 揭示连续监测如何改变介观输运，以及哪些输运性质得以保留。
Shows how particle interactions reshape the efficiency of a quantum Otto engine.: 揭示粒子间相互作用如何改变量子奥托热机的效率。
Connects quantum heat fluctuations with their classical Brownian-motion limit.: 将量子热涨落与经典布朗运动极限联系起来，阐明两种描述如何衔接。
Organizes several fluctuation relations into one unified picture for driven systems.: 将受驱动系统中的多种涨落关系纳入统一框架，厘清它们之间的联系。
Explains which notion of quantum work remains useful when initial coherence is present.: 分析存在初始相干时如何描述量子功，澄清适用的统计定义。
Identifies observable finite-time signatures of first-order phase transitions.: 找到有限时间一阶相变中可观测的特征，为识别非平衡相变提供依据。
Moves beyond average efficiency and characterizes the full performance fluctuations of the engine.: 超越平均效率，刻画热机性能的完整涨落统计。
Extends standard nonequilibrium relations so they still work in relativistic settings.: 将非平衡涨落关系拓展到相对论情形，保持其物理描述的一致性。
Uses geometric control ideas to improve finite-time Brownian engine performance.: 将几何控制方法用于有限时间布朗热机，寻找提升性能的操作方案。
Provides an explicit optimal-control recipe for pushing Brownian engines to maximum power.: 给出布朗热机实现最大功率的具体最优控制方案。
Introduces a geometric control principle for faster adiabatic quantum evolution.: 提出加快量子绝热演化的几何控制原则，指导更高效的操作路径设计。
Clarifies how to model open quantum dynamics without losing thermodynamic consistency.: 阐明如何在描述开放量子动力学时保持热力学一致性。
Shows how carefully timed control can improve both power and efficiency in Otto engines.: 表明精心安排控制时序能够同时改善奥托热机的功率与效率。
