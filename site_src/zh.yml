possibility.: 可能。
I study how quantum systems behave, how to control them, and where their advantages come from.: 理解量子系统的行为，探索如何控制它们，以及量子优势从何而来。
At Leiden University, I work with: 在莱顿大学，我与
on quantum nonlocality and open many-body dynamics. My research uses symmetry and optimization to develop multipartite Bell tests, and spectral-gap optimization to accelerate thermalization.: 合作研究量子非局域性与开放多体动力学，利用对称性和优化方法构建多体贝尔检验，并通过谱隙优化加速热化。
'My background in finite-time thermodynamics brings a complementary perspective: understanding the energetic cost of control. Thermodynamic geometry can optimize driving protocols, while spectral methods can optimize dissipation. Together, these approaches help explore the performance of quantum many-body heat engines.': 有限时间热力学提供了另一个视角：理解控制所需的能量代价。热力学几何用于优化驱动方案，谱方法用于优化耗散过程；结合两者，可以探索提升量子多体热机性能的途径。
I am also exploring connections between stochastic thermodynamics and generative AI, with applications in diffusion models and Transformers.: 我也在探索随机热力学与生成式人工智能 的联系，应用于扩散模型与 变换器模型中的学习和采样过程。
