{% extends 'base.html' %}{% block content %}<article class="container detail-page"><a class="back-link" href="{{ '/talks/' if item.collection == 'talks' else '/teaching/' }}"><i data-lucide="arrow-left"></i> {{ 'Presentations' if item.collection == 'talks' else 'Teaching' }}</a><p class="eyebrow">{{ item.type }} / {{ item.event_date or item.year }}</p><h1>{{ item.title }}</h1><p class="lead">{{ item.venue }}</p><p>{{ item.location }}</p>{% if item.venue_url %}<a class="button primary" href="{{ item.venue_url }}">Event website <i data-lucide="arrow-up-right"></i></a>{% endif %}</article>{% endblock %}
