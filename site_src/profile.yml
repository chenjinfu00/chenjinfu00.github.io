topics:
  - id: quantum_thermodynamics
    short: Quantum thermodynamics
    title: Quantum thermodynamics
    icon: orbit
    question: How can we control quantum dynamics and prepare useful states?
    text: I study quantum heat engines, thermalization, state preparation, and monitored transport. Geometric and spectral methods connect thermodynamic performance with the control of quantum dynamics.
    methods: Quantum heat engines · Thermalization · Quantum control
  - id: finite_time_stochastic_thermodynamics
    short: Finite-time & stochastic
    title: Finite-time and stochastic thermodynamics
    icon: route
    question: What sets the cost and fluctuations of fast processes?
    text: Thermodynamic geometry, optimal control, and fluctuation relations reveal the energetic cost of finite-time processes, from Brownian heat engines and membrane separation to quantum work and heat statistics.
    methods: Thermodynamic geometry · Optimal control · Fluctuations
  - id: quantum_nonlocality
    short: Nonlocality & many-body
    title: Quantum nonlocality and many-body systems
    icon: network
    question: How can we prepare and certify quantum many-body states?
    text: I use symmetry, spectral-gap optimization, and Lindblad dynamics to prepare and control many-body states. Multipartite Bell inequalities provide tests and certification of correlations beyond classical physics.
    methods: Bell inequalities · Spectral gaps · Lindblad dynamics
