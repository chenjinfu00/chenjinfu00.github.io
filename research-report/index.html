<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="陈劲夫中英文科研报告：量子多体态、随机热力学与有限时间控制。40分钟报告，未来展望仅两页。">
  <title>量子与非平衡系统的制备、涨落与优化 · 陈劲夫</title>
  <link rel="stylesheet" href="assets/style.css?v=20261017r2">
  <script src="assets/content.js?v=20261017r2" defer></script>
  <script src="assets/app.js?v=20261017r2" defer></script>
</head>
<body>
  <a class="skip-link" href="#presentation">跳至报告 / Skip to presentation</a>
  <div class="app-shell">
    <header class="app-header">
      <a class="identity" id="identity" href="#" aria-label="返回第一页">
        <span class="identity-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M5 20h30M20 5v30"/><circle cx="20" cy="20" r="10"/><path d="m8 8 24 24m0-24L8 32"/></svg></span>
        <span class="identity-copy"><strong id="profile-name">科研报告</strong><span id="profile-subtitle">Research presentation</span></span>
      </a>
      <div class="header-label"><span class="live-dot" aria-hidden="true"></span><span data-i18n="reportLabel">科研面试报告</span></div>
      <nav class="toolbar" aria-label="报告工具">
        <button id="overview-toggle" class="tool-button" type="button" aria-haspopup="dialog" title="报告目录 (O)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span data-i18n="overview">目录</span></button>
        <button id="notes-toggle" class="tool-button" type="button" aria-controls="notes-panel" aria-expanded="false" title="讲稿备注 (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span data-i18n="notes">讲稿</span></button>
        <button id="language-toggle" class="tool-button language-button" type="button" title="切换语言 (L)"><span class="language-current">中文</span><span class="language-divider" aria-hidden="true">/</span><span class="language-target">EN</span></button>
        <button id="fullscreen-toggle" class="tool-button icon-only" type="button" title="全屏展示 (F)" aria-label="全屏展示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5"/></svg></button>
        <button id="print-button" class="tool-button icon-only" type="button" title="打印 / 保存 PDF" aria-label="打印或保存 PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7z"/><path d="M16 11h1"/></svg></button>
      </nav>
    </header>

    <div class="presentation-layout">
      <aside id="section-rail" class="section-rail" aria-label="报告章节"></aside>
      <main id="presentation" class="presentation" tabindex="-1" aria-label="科研报告">
        <div id="slides" class="slide-stack"><div class="loading-state" role="status"><span class="loading-symbol" aria-hidden="true"></span><p>正在加载报告…<br><small>Loading presentation…</small></p></div></div>
      </main>
      <aside id="notes-panel" class="notes-panel" hidden aria-label="讲稿备注">
        <div class="notes-heading"><span><span class="eyebrow" data-i18n="presenterOnly">演讲者备注</span><h2 data-i18n="notes">讲稿</h2></span><button id="notes-close" class="close-button" type="button" aria-label="关闭讲稿"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div id="notes-title" class="notes-title"></div>
        <div id="notes-content" class="notes-content"></div>
        <div class="notes-tip" data-i18n="notesHint">按 N 显示或隐藏讲稿。备注不会出现在打印稿中。</div>
      </aside>
    </div>

    <footer class="app-footer">
      <div class="rehearsal">
        <button id="timer-toggle" class="timer-toggle" type="button" title="开始计时" aria-label="开始计时"><svg id="timer-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg></button>
        <span class="timer-text"><strong id="timer-value">00:00</strong><span id="timer-goal">/ 40:00</span></span>
        <button id="timer-reset" class="timer-reset" type="button" title="重置计时" aria-label="重置计时"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a8 8 0 1 1-1 6M5 4v5h5"/></svg></button>
        <span id="timer-status" class="timer-status" data-i18n="rehearsal">彩排计时</span>
      </div>
      <div class="slide-position"><span id="slide-section"></span><span class="position-divider" aria-hidden="true"></span><span id="slide-number">01 / 01</span><span id="slide-minutes"></span></div>
      <div class="slide-navigation"><button id="prev-button" class="nav-button" type="button" aria-label="上一页" title="上一页 (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><button id="next-button" class="nav-button next-button" type="button" aria-label="下一页" title="下一页 (→)"><span data-i18n="next">下一页</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div>
      <div class="deck-progress" aria-hidden="true"><span id="deck-progress-value"></span></div>
      <div class="time-progress" aria-hidden="true"><span id="time-progress-value"></span></div>
    </footer>
  </div>

  <dialog id="overview-dialog" class="overview-dialog" aria-labelledby="overview-title">
    <div class="overview-heading"><div><span class="eyebrow" data-i18n="presentationMap">Presentation map</span><h2 id="overview-title" data-i18n="overviewTitle">报告目录</h2><p data-i18n="overviewHint">选择任意一页，进入报告。</p></div><button id="overview-close" class="close-button" type="button" aria-label="关闭目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="overview-content" class="overview-content"></div>
    <div class="overview-shortcuts"><span><kbd>←</kbd><kbd>→</kbd> <span data-i18n="moveSlide">切换页面</span></span><span><kbd>N</kbd> <span data-i18n="notes">讲稿</span></span><span><kbd>L</kbd> <span data-i18n="language">语言</span></span><span><kbd>F</kbd> <span data-i18n="fullScreen">全屏</span></span><span><kbd>Esc</kbd> <span data-i18n="close">关闭</span></span></div>
  </dialog>
  <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
