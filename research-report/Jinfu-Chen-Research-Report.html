  <div id="toast" class="toast" role="status" hidden></div>
<script>/* Source-backed interview presentation. Scientific drawings are conceptual, not experimental data. */
(() => {
  const p = (zh,en) => ({zh,en});
  const card = (title,body,tag='') => `<article class="card">${tag?`<span class="tag">${tag}</span>`:''}<h3>${title}</h3><p>${body}</p></article>`;
  const cols = (...items) => `<div class="${items.length===3?'cols-3':'cols'}">${items.join('')}</div>`;
  const call = (text) => `<div class="callout">${text}</div>`;
  const formula = (text,caption) => `<div class="formula">${text}</div><p class="caption">${caption}</p>`;
  const src = (label,url) => ({label,url});
  const home = src(p('个人主页','Homepage'),'https://chenjinfu00.github.io/');
  const scholar = src(p('Google 学术 · 2026-10-13','Google Scholar · 2026-10-13'),'https://scholar.google.ca/citations?user=2n7U598AAAAJ&hl=en');
  const papers = {
    geo:src('PRL 128, 230603 (2022)','https://doi.org/10.1103/PhysRevLett.128.230603'),
    length:src('PRE 104, 034117 (2021)','https://doi.org/10.1103/PhysRevE.104.034117'),
    membrane:src('PRX Energy 2, 033003 (2023)','https://doi.org/10.1103/PRXEnergy.2.033003'),
    brownian:src('PRE 106, 054108 (2022)','https://doi.org/10.1103/PhysRevE.106.054108'),
    control:src('PRE 110, L042105 (2024)','https://doi.org/10.1103/PhysRevE.110.L042105'),
    hierarchical:src('PRE 107, 024135 (2023)','https://doi.org/10.1103/PhysRevE.107.024135'),
    covariant:src('PRL 134, 237102 (2025)','https://doi.org/10.1103/xlmq-g6m5'),
    phase:src('PRL 134, 177101 (2025)','https://doi.org/10.1103/PhysRevLett.134.177101'),
    thermal:src('PRB 113, 184313 (2026)','https://doi.org/10.1103/r43j-qfj5'),
    gap:src('PRL 135, 090602 (2025)','https://doi.org/10.1103/cslt-x32n'),
    dynamic:src('PRR 4, 023252 (2022)','https://doi.org/10.1103/PhysRevResearch.4.023252'),
    bell:src('arXiv:2511.07523 · Preprint','https://arxiv.org/abs/2511.07523'),
    scaling:src('PRL 125, 210601 (2020)','https://doi.org/10.1103/PhysRevLett.125.210601')
  };
  const slides=[];
  function add(id,section,minutes,title,kicker,zh,en,nzh,nen,sources=[],backup=false){slides.push({id,section:p(...section),minutes,title:p(...title),kicker:p(...kicker),html:p(zh,en),notes:p(nzh,nen),sources,backup});}
  const I=['个人与研究经历','Background'];
  const R=['代表性研究成果','Research'];
  const F=['未来科研规划','Research agenda'];
  const B=['问答与备用材料','Discussion & backup'];
  function geometry(en=false){return `<div class="diagram"><svg viewBox="0 0 660 300" role="img" aria-label="${en?'Conceptual geometry of control paths':'控制路径的几何示意'}"><defs><marker id="arr-g-${en}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" opacity=".10"><ellipse cx="330" cy="155" rx="90" ry="45"/><ellipse cx="330" cy="155" rx="160" ry="85"/><ellipse cx="330" cy="155" rx="230" ry="125"/></g><path d="M80 260H620M80 260V30" stroke="currentColor" fill="none" opacity=".4" marker-end="url(#arr-g-${en})"/><path d="M160 215C180 35 440 25 510 90" fill="none" stroke="#b67654" stroke-width="4" stroke-dasharray="8 6"/><path d="M160 215Q310 190 510 90" fill="none" stroke="#24766e" stroke-width="6"/><circle cx="160" cy="215" r="8" fill="#142f43"/><circle cx="510" cy="90" r="8" fill="#142f43"/><g fill="currentColor" font-size="19" font-family="sans-serif"><text x="105" y="244">A</text><text x="526" y="86">B</text><text x="250" y="58">${en?'Protocol choice':'可选控制路径'}</text><text x="300" y="218">${en?'Geodesic':'测地线'}</text><text x="591" y="284">λ₁</text><text x="40" y="35">λ₂</text></g></svg><p class="caption">${en?'Conceptual illustration · metric and paths depend on the physical model.':'概念示意 · 度量与最优路径取决于具体物理模型。'}</p></div>`;}
  function spectrum(en=false){return `<div class="diagram"><svg viewBox="0 0 660 260" role="img" aria-label="${en?'Spectral gap optimization schematic':'谱隙优化示意'}"><g stroke="#142f43" stroke-width="3"><path d="M100 210H275M385 210H565"/><path d="M100 170H275M385 105H565"/><path d="M100 105H275M385 65H565" opacity=".22"/><path d="M100 65H275M385 35H565" opacity=".22"/></g><g stroke="#b67654" stroke-width="3"><path d="M195 210V170M185 177L195 170L205 177M185 203L195 210L205 203"/><path d="M480 210V105M470 112L480 105L490 112M470 203L480 210L490 203"/></g><path d="M295 130H360M349 122L360 130L349 138" stroke="#24766e" stroke-width="3" fill="none"/><g fill="currentColor" font-size="20" font-family="sans-serif"><text x="110" y="247">${en?'Original dynamics':'原始动力学'}</text><text x="400" y="247">${en?'Optimized dynamics':'优化动力学'}</text><text x="205" y="196">Δ</text><text x="492" y="163">Δ′</text><text x="92" y="27">${en?'Same target · larger gap':'目标不变 · 谱隙增大'}</text></g></svg><p class="caption">${en?'Conceptual spectrum · no numerical or experimental data.':'概念谱图 · 非数值或实验数据。'}</p></div>`;}
  add('opening',I,.5,['非平衡系统的\n几何、控制与学习','Geometry, control and learning\nin nonequilibrium systems'],['陈劲夫 · 科研报告','Jin-Fu Chen · Research talk'],
    `<div class="cover-line">从有限时间热力学到人工智能的物理描述</div><div class="cover-signature"><strong>陈劲夫 <span>Jin-Fu Chen</span></strong><p>荷兰莱顿大学 · Lorentz 理论物理研究所</p></div><div class="pathway"><span>热力学几何</span><span>动力学优化</span><span>学习与生成</span></div>`,
    `<div class="cover-line">From finite-time thermodynamics to a physical description of AI</div><div class="cover-signature"><strong>Jin-Fu Chen <span>陈劲夫</span></strong><p>Leiden University · Lorentz Institute for Theoretical Physics</p></div><div class="pathway"><span>Thermodynamic geometry</span><span>Dynamics optimization</span><span>Learning & generation</span></div>`,
    '各位老师好，我是陈劲夫，目前在荷兰莱顿大学 Lorentz 理论物理研究所从事博士后研究。今天报告围绕一个持续贯穿我工作的科学问题：当一个过程必须在有限时间内完成时，我们怎样刻画它的代价，并设计更好的动力学？我会先简要介绍研究经历，重点讲有限时间热力学和谱隙优化方面的成果，最后介绍随机热力学与人工智能相结合的科研规划。',
    'Thank you for the opportunity to present my research. I am Jin-Fu Chen, a postdoctoral researcher at the Lorentz Institute in Leiden. The question running through my work is how to quantify the cost of a process completed in finite time, and how to design better dynamics. I will introduce my background, discuss representative results in thermodynamic geometry and spectral optimization, and outline my planned work at the interface of stochastic thermodynamics and AI.',[home]);
  add('agenda',I,.5,['报告路线','Roadmap'],['40 分钟报告 · 约 20 分钟讨论','40-minute talk · approximately 20-minute discussion'],
    `<div class="agenda">${card('01 · 个人与研究经历','教育背景、研究主线与项目经历','5 min')}${card('02 · 代表性研究成果','有限时间代价、最优控制与谱隙优化','25 min')}${card('03 · 未来科研规划','人工智能模型的随机热力学与优化','10 min')}</div>`,
    `<div class="agenda">${card('01 · Background','Education, research trajectory and project experience','5 min')}${card('02 · Research','Finite-time costs, optimal control and spectral optimization','25 min')}${card('03 · Research agenda','Stochastic thermodynamics and optimization of AI models','10 min')}</div>`,
    '报告大约四十分钟。前五分钟介绍背景，中间二十五分钟集中讲三组相互联系的研究工作：热力学几何与代价界、非平衡最优控制、以及固定目标态的谱隙优化。最后十分钟说明我希望如何把这些方法延伸到学习与生成模型。讨论时可以跳转到备用页，进一步谈适用条件、独立贡献和具体实施。',
    'The talk allocates five minutes to background, twenty-five to research, and ten to future plans. The scientific core covers geometric cost bounds, optimal control, and spectral optimization at a fixed target state. I will then explain how these methods motivate a research agenda for learning and generative models. Backup slides support discussion of assumptions, individual contributions and implementation.');
  add('timeline',I,2,['从量子热力学到动力学设计','From quantum thermodynamics to dynamics design'],['教育与研究经历','Education & research trajectory'],
    `<div class="timeline">${card('2012—2016 · 北京大学','物理学学士、数学双学位')}${card('2016—2021 · 中国工程物理研究院','物理学博士；北京计算科学研究中心开展研究<br>导师：孙昌璞')}${card('2021.07—2024.02 · 北京大学','物理学院博士后；合作导师：全海涛')}${card('2024.02—至今 · 莱顿大学','Lorentz 理论物理研究所博士后<br>合作导师：Jordi Tura')}</div>`,
    `<div class="timeline">${card('2012–2016 · Peking University','B.S. in Physics; double degree in Mathematics')}${card('2016–2021 · China Academy of Engineering Physics','Ph.D. in Physics; research at Beijing Computational Science Research Center<br>Supervisor: C. P. Sun')}${card('Jul 2021–Feb 2024 · Peking University','Postdoctoral researcher, School of Physics<br>Collaborator: H. T. Quan')}${card('Feb 2024–present · Leiden University','Postdoctoral researcher, Lorentz Institute<br>Collaborator: Jordi Tura')}</div>`,
    '我在北京大学完成物理学本科和数学双学位学习。博士阶段在中国工程物理研究院培养、北京计算科学研究中心开展研究，导师是孙昌璞老师，主要研究量子热力学、有限时间过程与热力学几何。之后在北京大学与全海涛老师合作，进一步研究随机热力学、涨落关系和最优控制。从二〇二四年二月起，我在莱顿与 Jordi Tura 合作，把动力学优化问题拓展到量子多体热化、张量网络与量子信息。这些阶段在研究对象上有所扩展，但一直围绕有限时间、代价界和可控性展开。',
    'My undergraduate training in physics and mathematics was at Peking University. During my Ph.D. at CAEP, with research at the Beijing Computational Science Research Center under C. P. Sun, I worked on quantum thermodynamics and finite-time processes. At Peking University with H. T. Quan, I extended this work to stochastic thermodynamics, fluctuation relations and optimal control. Since February 2024, my work with Jordi Tura in Leiden has expanded to many-body thermalization, tensor networks and quantum information. The common thread is the cost and controllability of finite-time dynamics.',[home]);
  add('profile',I,2,['科研积累与项目经历','Research record and project experience'],['成果概览','Research record'],
    `<div class="cols-3">${card('34 篇','已发表论文<br><small>简历统计：2026 年 9 月</small>','Publications')}${card('918 / 16','Google 学术引用 / h 指数<br><small>核查：2026-10-13</small>','Citations / h-index')}${card('5 篇 PRL · 2 篇独著','代表成果覆盖热力学、控制与量子多体<br><small>论文清单统计：2026 年 8 月</small>','Selected record')}</div>${call('项目经历：国家自然科学基金理论物理博士后项目 12147157<br>“受驱动开放系统的非平衡热力学” · 2022.01—2022.12')}`,
    `<div class="cols-3">${card('34 papers','Published journal articles<br><small>CV snapshot: September 2026</small>','Publications')}${card('918 / 16','Google Scholar citations / h-index<br><small>Verified: 13 October 2026</small>','Citations / h-index')}${card('5 PRLs · 2 sole-author papers','Thermodynamics, control and quantum many-body physics<br><small>Publication list: August 2026</small>','Selected record')}</div>${call('Project experience: NSFC theoretical physics postdoctoral program, No. 12147157<br>“Nonequilibrium thermodynamics of driven open systems” · Jan–Dec 2022')}`,
    '这里把成果统计和项目经历放在一起，作为后续具体工作的背景。三十四篇已发表论文来自最新简历的统计；Google 学术的九百一十八次引用和 h 指数十六是本次准备时读取的资料页数值，二者统计口径不同。五篇 PRL 和两篇独著分别说明合作研究积累和独立研究经验。项目方面，简历列有二〇二二年的国家自然科学基金理论物理博士后项目，主题是受驱动开放系统的非平衡热力学。项目中的具体职责在正式面试前还需与原始记录核对，不在本报告中额外使用主持人称谓。接下来我会用具体科学问题和成果说明这些积累。',
    'These statistics provide context for the scientific results. The thirty-four published articles are from the recent CV; the citation count and h-index were read directly from Google Scholar during preparation and follow a different counting scope. Five PRLs reflect collaborative work, while two sole-author papers demonstrate independent research experience. My CV also lists the 2022 NSFC theoretical physics postdoctoral project on driven open systems. The exact project role should be checked against the original record before the interview, so this slide does not assign a PI designation.',[home,scholar]);
  add('question',R,1,['一个贯穿各项工作的科学问题','A question connecting the research'],['研究主线','Research theme'],
    `<p class="big-quote">在给定时间与资源下，<br>怎样以更小代价完成目标过程？</p>${cols(card('代价','额外功、熵产生、控制资源'),card('速度','操作时间、弛豫速度、谱隙'),card('质量','目标态误差、任务精度、稳定性'))}`,
    `<p class="big-quote">How can a target process be completed<br>at lower cost, with finite time and resources?</p>${cols(card('Cost','Excess work, entropy production, control resources'),card('Speed','Process duration, relaxation rate, spectral gap'),card('Quality','Target-state error, task accuracy, stability'))}`,
    '把热机、分离过程和量子态制备放在一起看，它们有一个共同结构：我们指定初态和目标，限制时间与可用资源，然后寻找更好的过程。热力学问题里，代价常表现为额外功或熵产生；态制备问题里，困难可能表现为小能隙或慢弛豫。这里的代价、速度和质量并不是对所有系统都通用的一条公式，而是帮助我比较不同问题的研究框架。关键是把约束写清楚，避免通过无限增大控制强度得到没有意义的加速。',
    'Heat engines, separation processes and quantum state preparation share a useful structure: specify the initial and target conditions, constrain time and resources, and improve the process. Costs may mean excess work or entropy production, while slow preparation may arise from a small gap. This is a research framework, not a universal equation across all systems. Resource constraints must be explicit; otherwise, arbitrary rescaling of the generator can create a trivial speedup.');
  add('finite-time',R,1.5,['有限时间操作为什么有额外代价？','Why does finite-time operation cost more?'],['成果线一 · 有限时间热力学','Research I · Finite-time thermodynamics'],
    `${cols(card('准静态极限','系统持续接近平衡态<br>可逆过程给出理想代价'),card('实际操作','控制参数随时间变化<br>有限弛豫导致滞后与耗散'))}${formula('W = ΔF + W<sub>ex</sub>','等温过程的额外功 Wex 衡量相对于准静态基准的代价。')}${call('研究目标：建立可检验的代价下界，并找到接近下界的控制路径。')}`,
    `${cols(card('Quasistatic limit','The system remains close to equilibrium<br>A reversible process defines the ideal cost'),card('Practical operation','Controls vary in time<br>Finite relaxation produces lag and dissipation'))}${formula('W = ΔF + W<sub>ex</sub>','For an isothermal process, excess work measures cost above the quasistatic reference.')}${call('Goal: obtain testable lower bounds and protocols that approach them.')}`,
    '以等温过程为例，可逆自由能差给出一个理想基准，但它通常要求无限慢操作。有限时间驱动时，系统来不及跟随瞬时平衡态，会产生额外功。研究的重点有两个：第一，额外代价至少有多大；第二，在允许的控制条件下能否实现这个下界。相关实验合作工作检验过特定有限时间过程中的一比时间标度，我作为第三作者参与这一合作，不能把它表述为我独立主导的实验。理论上的几何方法则进一步回答：路径不同，耗散如何变化，以及怎样选择路径。',
    'For an isothermal process, the free-energy difference gives the reversible reference, usually reached in the infinitely slow limit. Finite-time driving creates a lag from instantaneous equilibrium and an additional cost. The questions are how low this cost can be and whether the bound can be achieved with allowed controls. A collaborative experimental paper tested inverse-time entropy-generation scaling in a specified process; I was the third author. The geometric approach then clarifies how dissipation depends on the chosen path.',[papers.scaling,papers.length]);
  add('geometry',R,2.5,['把耗散优化变成几何问题','Turning dissipation optimization into geometry'],['热力学长度与测地线','Thermodynamic length & geodesics'],
    `${cols(`<div>${formula('W<sub>ex</sub> ≥ ℒ² / τ','在相关模型与慢驱动/捷径框架的适用条件下。')}<p>路径决定热力学长度 ℒ；<br>时间分配决定如何沿路径运动。</p>${call('最短路径 + 合适的速度分配<br>给出低耗散控制方案。')}</div>`,geometry())}`,
    `${cols(`<div>${formula('W<sub>ex</sub> ≥ ℒ² / τ','Within the applicable model and slow-driving or shortcut framework.')}<p>The path determines the length ℒ;<br>the schedule determines motion along it.</p>${call('A shortest path and an appropriate schedule<br>provide a low-dissipation protocol.')}</div>`,geometry(true))}`,
    '热力学几何把控制参数看作坐标，把局部耗散响应写成度量。在适用的慢驱动或捷径框架下，额外功与热力学长度平方除以操作时间联系起来。这个结果的物理意义是把路径选择和时间分配分开：先寻找短路径，再选择合适的速度。二〇二一年的第一作者论文提出用有限时间测量外推热力学长度，针对单控制参数，不要求先寻找最优方案。二〇二二年的 PRL 工作将捷径等温过程中的最小代价化为测地线问题，我是第二作者。图只是几何结构示意，不是论文数值数据。正式讲述时应说明具体模型、控制代价的定义和下界可达条件。',
    'Thermodynamic geometry treats control parameters as coordinates and local dissipative response as a metric. In the applicable slow-driving or shortcut framework, excess work is bounded by length squared divided by duration. This separates path selection from scheduling. My first-author 2021 paper proposed extrapolating thermodynamic length from finite-time measurements for a single control parameter, without first locating the optimal protocol. In the 2022 PRL I was the second author; that work mapped minimal shortcut costs to geodesics. The drawing illustrates the structure only. The model, cost definition and attainability conditions remain essential.',[papers.length,papers.geo]);
  add('membrane',R,2.5,['有限时间膜分离：能耗的测地线下界','Finite-time membrane separation: a geometric cost bound'],['PRX Energy 2, 033003 · 2023','PRX Energy 2, 033003 · 2023'],
    `${cols(card('科学问题','在限定时间内完成混合气体分离，额外能耗的下界是什么？'),card('方法与结果','构造热力学度量和长度<br>以测地线优化分离路径<br>对称装置的最优协议可以打破对称性'))}${call('我的贡献：共同第一作者；参与问题设计、理论推导与主要结果分析。')}<p class="caption">模型：二元气体膜分离。结论是模型内的理论界与优化协议。</p>`,
    `${cols(card('Question','What limits the excess energy cost of separating a gas mixture in a prescribed time?'),card('Method & result','Construct a thermodynamic metric and length<br>Optimize separation paths using geodesics<br>An optimal protocol may break the device symmetry'))}${call('My contribution: co-first author; problem formulation, theoretical derivations and principal analysis.')}<p class="caption">Model: binary-gas membrane separation. Results are theoretical bounds and protocols within that model.</p>`,
    '膜分离把几何方法带到一个更具体的任务：我们要在有限时间内将二元混合气体分开。可逆分离功只是基准，实际操作还有额外代价。我们建立分离过程的热力学度量，用长度给出额外能耗下界，并通过测地线选择最优路径。一个有意思的结果是，对称装置并不必然对应对称最优协议。我的角色是共同第一作者，参与研究问题的设计、理论推导和主要分析。这项工作说明几何方法可以针对具体任务给出可计算的优化建议，但它讨论的是指定模型；目前不能直接说已经在工业装置中实现节能。',
    'Membrane separation gives the geometric approach a concrete task: separate a binary gas mixture within a finite duration. Reversible separation work is only the baseline. We constructed a thermodynamic metric, obtained a length-based bound on excess energy, and optimized the path using geodesics. A notable result is that a symmetric device can have an optimal protocol that breaks its symmetry. I was a co-first author and contributed to problem formulation, theoretical derivations and the principal analysis. The result is model-specific and should not be presented as demonstrated industrial energy savings.',[papers.membrane]);
  add('brownian',R,2,['布朗热机：从代价界到可达最优协议','Brownian heat engines: from bounds to optimal protocols'],['独著 · PRE 106, 054108 · 2022','Sole author · PRE 106, 054108 · 2022'],
    `${cols(card('要解决的问题','有限时间热机怎样同时选择循环路径和操作速度？'),card('独立完成的工作','利用等温捷径构造有限时间过程<br>建立循环的热力学几何描述<br>得到可达的输出功率界与最优协议'))}${formula('P = W<sub>out</sub> / τ','优化对象是整个循环的输出功率。')}${call('意义：在该捷径模型内，将欠阻尼与过阻尼之外的一般阻尼情形纳入统一描述。')}`,
    `${cols(card('Question','How should a finite-time engine choose both its cycle and its schedule?'),card('Independent work','Construct finite-time processes using shortcuts to isothermality<br>Describe the cycle geometrically<br>Obtain an attainable output-power bound and protocol'))}${formula('P = W<sub>out</sub> / τ','The optimization concerns output power over the complete cycle.')}${call('Significance: a unified description for general damping within the shortcut model.')}`,
    '这篇论文是我独立完成的研究，适合用来说明从问题提出到理论分析的独立能力。研究对象是布朗热机，我利用等温捷径构造有限时间循环，再用热力学长度描述控制过程。与只在高度欠阻尼或过阻尼极限处理问题相比，这一框架适用于一般阻尼情形。我给出了可达的输出功率界，达到下界相关条件的协议需要按热力学长度分配速度。这里一定要区分模型中的捷径控制和普通实验控制；协议的可达性是在所定义的控制集合中成立。下一项工作则进一步从最优控制出发，直接研究循环结构。',
    'This sole-author paper demonstrates independent work from problem formulation to analysis. I studied Brownian heat engines using shortcuts to isothermality, with thermodynamic length describing finite-time cycles. The approach includes general damping, rather than only strongly underdamped or overdamped limits. It gives an attainable output-power bound and an optimal schedule based on thermodynamic length. Attainability refers to the control set defined in the shortcut model. The next paper instead uses optimal control to investigate the cycle structure directly.',[papers.brownian]);
  add('optimal-control',R,2,['最优控制决定热机的循环结构','Optimal control determines the engine cycle'],['第一作者、共同通讯 · PRE 110, L042105 · 2024','First & co-corresponding author · PRE 110, L042105 · 2024'],
    `${cols(card('问题','给定可用控制与约束，最大功率循环应具有怎样的结构？'),card('发现','一般阻尼条件下的最优控制分析<br>两段等温、两段绝热<br>高刚度处加入等容弛豫'))}<div class="pathway"><span>等温</span><span>绝热</span><span>等容弛豫</span><span>闭合循环</span></div>${call('我的贡献：第一作者、共同通讯作者；将有限时间热机问题推进到最优控制框架。')}`,
    `${cols(card('Question','What cycle structure maximizes power under the specified controls and constraints?'),card('Finding','Optimal-control analysis for general damping<br>Two isothermal and two adiabatic segments<br>Additional isochoric relaxation at high stiffness'))}<div class="pathway"><span>Isothermal</span><span>Adiabatic</span><span>Isochoric relaxation</span><span>Closed cycle</span></div>${call('My contribution: first and co-corresponding author; extending finite-time engine analysis through optimal control.')}`,
    '热机研究不只是在预先给定的循环上调时间。一个更深的问题是，最大功率循环本身应该是什么形状。我们在给定控制条件的一般阻尼模型中进行最优控制分析，得到两段等温、两段绝热以及高刚度处的额外等容弛豫结构。这个结果连接欠阻尼与过阻尼的讨论，也说明弛豫过程本身可以是优化方案的一部分。我是第一作者和共同通讯作者。对面试评委，最值得强调的不是循环名称，而是方法上的推进：从猜一个协议再验证，转向在约束下由动力学和优化条件决定协议结构。',
    'Engine optimization need not be limited to adjusting timings on a predefined cycle. We asked what the maximum-power cycle itself should look like. Under the specified controls in a general-damping model, optimal-control analysis identifies two isothermals, two adiabatics and an extra isochoric relaxation segment at high stiffness. This connects underdamped and overdamped discussions and makes relaxation part of the optimization. I was the first and co-corresponding author. The methodological advance is to let dynamics and constraints determine the protocol structure.',[papers.control]);
  add('fluctuation',R,1.5,['从平均代价走向过程的涨落统计','From mean costs to fluctuation statistics'],['随机热力学与协变涨落关系','Stochastic thermodynamics & covariant fluctuation relations'],
    `${cols(card('多热库的涨落关系层级','联合功—热统计保留一族涨落关系<br>边缘化后通常不能保留全部结构<br><span class="tag">PRE 2023 · 第一作者</span>'),card('协变形式的涨落定理','将非平衡功与热的涨落关系推广到协变描述<br>明确过程、观测与变换的关系<br><span class="tag">PRL 2025 · 共同通讯</span>'))}${call('方法积累：轨道统计、联合分布、微观可逆性与粗粒化。')}`,
    `${cols(card('Hierarchy for multiple reservoirs','Joint work–heat statistics retain a family of fluctuation relations<br>Marginalization generally loses part of this structure<br><span class="tag">PRE 2023 · First author</span>'),card('Covariant fluctuation theorems','Promote nonequilibrium work and heat relations to covariant forms<br>Specify processes, observations and transformations<br><span class="tag">PRL 2025 · Co-corresponding</span>'))}${call('Methods: trajectory statistics, joint distributions, microreversibility and coarse-graining.')}`,
    '平均耗散无法描述所有过程特征，因此我也研究功和热的涨落。在多热库驱动系统中，我们发现联合功热分布具有一族涨落关系；如果只看边缘分布，通常会丢失部分结构。二〇二三年这篇工作我是第一作者。之后与裴继辉、全海涛合作，把涨落关系推进到协变形式，我是共同通讯作者，该 PRL 被选为编辑推荐。这些工作训练了我从轨道概率和粗粒化出发分析不可逆性的能力。后面的人工智能规划会使用这一方法基础，但不能把数据模型的路径不可逆性未经论证地直接等同于硬件散热。',
    'Mean dissipation does not capture all process properties, so I also study fluctuations of work and heat. For driven systems coupled to multiple reservoirs, joint work–heat distributions retain a family of relations, while marginal distributions generally lose part of the structure. I was the first author of the 2023 paper. The later PRL, with J.-H. Pei and H. T. Quan, promotes fluctuation relations to covariant forms; I was a co-corresponding author and the paper received an Editors’ Suggestion. These methods support trajectory-level studies of irreversibility, including my future AI agenda, with physical dissipation kept distinct from statistical irreversibility.',[papers.hierarchical,papers.covariant]);
  add('phase-transition',R,1.5,['一阶相变：有限时间标度与遍历性','First-order transitions: scaling and ergodicity'],['共同通讯 · PRL 134, 177101 · 2025','Co-corresponding author · PRL 134, 177101 · 2025'],
    `${cols(card('科学问题','相变附近，有限时间代价如何随驱动速度和系统尺寸变化？'),card('核心结果','Curie–Weiss 模型中的遍历性破缺<br>大系统：额外功随 v<sup>2/3</sup> 标度<br>小系统：向 v 标度交叉'))}${call('有限尺寸与极限顺序影响耗散标度；不能默认所有过程都服从同一种慢驱动关系。')}<p class="caption">v 为论文定义的驱动速度；上述结果限于所研究模型与标度区域。</p>`,
    `${cols(card('Question','How does finite-time cost near a phase transition depend on driving speed and size?'),card('Core result','Ergodicity breaking in the Curie–Weiss model<br>Large systems: excess-work scaling as v<sup>2/3</sup><br>Small systems: crossover to v scaling'))}${call('Finite size and the order of limits matter; a single slow-driving law cannot be assumed for every process.')}<p class="caption">v is the driving speed defined in the paper; statements apply to the studied model and scaling regimes.</p>`,
    '这一工作提醒我们，几何慢驱动图像也有适用边界。相变附近存在长弛豫时间和遍历性问题，系统尺寸与驱动速度的极限顺序会影响耗散。在 Curie–Weiss 模型中，我们分析了有限时间一阶相变的遍历性破缺，看到大系统中的额外功具有速度的三分之二次幂标度，而小系统会交叉到线性速度标度。我是第二作者和共同通讯作者。它与后面多体热化的联系是：当动力学变慢时，既要理解慢的来源，也要研究能否在保持物理目标的前提下改变动力学。',
    'This paper illustrates a limitation of simple slow-driving pictures. Near phase transitions, long relaxation times and ergodicity issues make the order of size and driving-speed limits important. In the Curie–Weiss model, excess work scales with speed to the two-thirds power for large systems, with a crossover to linear scaling in small systems. I was the second and co-corresponding author. The link to many-body thermalization is that we must understand why dynamics becomes slow and ask whether it can be redesigned without changing the physical target.',[papers.phase]);
  add('thermalization-question',R,2,['目标热态不变，热化能否更快？','Can thermalization be faster at the same target state?'],['成果线二 · 量子多体与谱隙优化','Research II · Many-body dynamics & spectral optimization'],
    `${formula('ρ<sub>β</sub> = e<sup>−βH</sup> / Z','目标：给定哈密顿量的 Gibbs 热态。')}${cols(card('固定的目标','保持目标稳态与热力学一致性<br>指定允许的局域结构和控制约束'),card('可优化的自由度','改变耗散生成元<br>在约束下增大谱隙<br>检验收敛与可扩展性'))}${call('核心思路：目标态并不唯一决定制备它的动力学。')}`,
    `${formula('ρ<sub>β</sub> = e<sup>−βH</sup> / Z','Target: the Gibbs state of a specified Hamiltonian.')}${cols(card('Fixed target','Preserve the stationary state and thermodynamic consistency<br>Specify locality and control constraints'),card('Optimization freedom','Modify the dissipative generator<br>Enlarge the gap under constraints<br>Test convergence and scalability'))}${call('Key idea: a target state does not uniquely specify its preparation dynamics.')}`,
    '过去的有限时间热力学主要优化外部控制路径。到量子多体系统，可以进一步问：目标热态固定以后，制备它的动力学是否仍然有自由度？答案是有的。我们的研究保留给定哈密顿量的 Gibbs 热态，设计热力学一致的耗散生成元，并在允许的控制集合中优化谱隙。这里不能简单把所有跃迁速率乘一个任意大常数，因为那只是增加资源。真正的问题是，在指定约束下利用结构性自由度改善慢模态。这种目标不变、动力学可调的思路是后面学习模型优化规划的一项主要方法基础。',
    'Earlier work optimized external control paths. For many-body systems, we can also ask whether preparation dynamics remains adjustable after fixing the target Gibbs state. We preserve the thermal state, construct thermodynamically consistent dissipative generators, and optimize their gap within the allowed control set. Multiplying all rates by an arbitrarily large constant would only add resources, so constraints must be specified. The aim is to improve slow modes through structural freedom. This fixed-target, adjustable-dynamics viewpoint also motivates my planned work on learning models.',[papers.thermal]);
  add('thermalization-framework',R,2.5,['构造、降维与优化相结合','Combining construction, reduction and optimization'],['第一作者、共同通讯 · PRB 113, 184313 · 2026','First & co-corresponding author · PRB 113, 184313 · 2026'],
    `<div class="pathway"><span>一致性构造</span><span>对称性降维</span><span>张量网络</span><span>梯度优化</span></div>${cols(card('理论框架','构造以目标 Gibbs 态为稳态的 Lindbladian<br>利用对称性减少优化复杂度'),card('规模与验证','张量网络处理更大系统<br>谱隙下界与变分上界辅助验证<br>覆盖经典与量子多体模型'))}${call('我的贡献：核心理论框架、优化方法与主要结果；第一作者、共同通讯作者。')}`,
    `<div class="pathway"><span>Consistent construction</span><span>Symmetry reduction</span><span>Tensor networks</span><span>Gradient optimization</span></div>${cols(card('Theory','Construct Lindbladians with the target Gibbs state as stationary state<br>Reduce complexity using symmetry'),card('Scale & verification','Use tensor networks for larger systems<br>Certified lower and variational upper gap bounds<br>Classical and quantum many-body models'))}${call('My contribution: core framework, optimization method and principal results; first and co-corresponding author.')}`,
    '这项二〇二六年正式发表于 PRB 的工作，可以分成四个步骤。首先构造保持目标热态的 Lindbladian，保证目标与动力学是一致的；其次利用对称性减少自由参数和计算维数；第三引入张量网络，超越只做小尺寸精确对角化的范围；最后通过梯度方法优化谱隙。对于较大系统，我们结合可验证的下界与变分上界判断谱隙，而不是只依赖一次数值优化的输出。我的贡献集中在核心理论框架、优化方法与主要结果，担任第一作者和共同通讯作者。报告时应强调这是结构设计加数值验证相结合的工作，并说明不同模型采用的约束。',
    'The 2026 PRB combines four ingredients. We first construct Lindbladians that preserve the target Gibbs state, then use symmetry to reduce parameters and dimension. Tensor networks extend the analysis beyond small-system exact diagonalization, and gradient optimization improves the gap. For larger systems, certified lower and variational upper bounds support validation instead of relying solely on an optimizer output. My contributions were the core theoretical framework, optimization method and principal results, as first and co-corresponding author. The constraints are model-specific and should be stated when discussing particular examples.',[papers.thermal]);
  add('gap-principle',R,2,['谱隙是优化抓手，也需要动力学验证','The gap is an optimization tool, with dynamical checks'],['方法与边界','Method & scope'],
    `${cols(`<div>${formula('Δ = min<sub>λ ≠ 0</sub> [−Re λ]','耗散生成元的非零慢模态谱隙（适用的谱结构下）。')}<p>优化慢模态，改善弛豫时间尺度。</p>${call('比较必须固定生成元的资源约束。<br>有限时间性能还受初态与瞬态影响。')}</div>`,spectrum())}`,
    `${cols(`<div>${formula('Δ = min<sub>λ ≠ 0</sub> [−Re λ]','Gap of the nonzero slow modes, where this spectral description applies.')}<p>Optimize slow modes to improve relaxation scales.</p>${call('Compare at fixed generator resource constraints.<br>Finite-time behavior also depends on initial conditions and transients.')}</div>`,spectrum(true))}`,
    '谱隙给出慢模态的时间尺度，因此是一个自然的优化目标。但是面试时如果被问到“谱隙大是不是一定更快”，答案需要有条件。实际收敛还取决于初态、误差范数、非正规性和有限时间瞬态，以及目标稳态误差。我们的多体工作提供谱隙优化的结构与验证方法；未来拓展到更一般的学习模型时，我会同时评估有限时间收敛和累计代价。这个限定很重要，因为只有在比较目标、精度和资源一致时，加速才有清楚的物理或计算意义。图里只是说明谱隙增大的概念，没有画未经核实的倍数。',
    'The gap provides a slow-mode time scale and is a natural optimization target. A larger gap does not automatically guarantee every finite-time performance measure: initial states, norms, non-normality, transients and steady-state error can matter. The many-body work provides construction and verification tools for gap optimization. In broader learning models, I plan to test finite-time convergence and accumulated cost as well. Speedup is meaningful only with matched targets, accuracy and resources. The diagram illustrates the concept without claiming a numerical improvement factor.',[papers.thermal]);
  add('adiabatic',R,2,['保持目标态，优化绝热制备的能隙','Optimize the preparation gap while preserving the target state'],['共同通讯 · PRL 135, 090602 · 2025','Co-corresponding author · PRL 135, 090602 · 2025'],
    `${cols(card('封闭系统中的对应问题','目标张量网络态固定<br>利用母哈密顿量的非唯一性<br>优化绝热路径的能隙'),card('研究结果与积累','在随机一维张量网络态、AKLT 与 GHZ 等例子中研究<br>连接量子几何、哈密顿量设计与态制备'))}${call('我的贡献：参与能隙优化思路、理论分析与研究设计；共同通讯作者。')}<p class="caption">相关独著：PRR 4, 023252 (2022)，以动力学量子几何张量研究绝热过程加速。</p>`,
    `${cols(card('Closed-system counterpart','Fix a target tensor-network state<br>Exploit nonunique parent Hamiltonians<br>Optimize the gap along the adiabatic path'),card('Results & foundations','Examples include random 1D tensor-network states, AKLT and GHZ<br>Connect quantum geometry, Hamiltonian design and preparation'))}${call('My contribution: gap-optimization concept, theoretical analysis and research design; co-corresponding author.')}<p class="caption">Related sole-author work: PRR 4, 023252 (2022), dynamical quantum geometric tensors for faster adiabatic processes.</p>`,
    '固定目标但优化动力学的思路不只适用于开放系统。在封闭系统里，一个目标张量网络态可以对应多个母哈密顿量。我们利用这种自由度，在保持目标态的条件下优化绝热制备路径的能隙，研究了随机一维张量网络态、AKLT 和 GHZ 等例子。我参与优化概念、理论分析和研究设计，是共同通讯作者。它也与我二〇二二年独著的动力学量子几何张量工作相接：前者强调目标态约束下的哈密顿量自由度，后者从动力学几何出发设计加速。两类结果共同构成我在量子控制与制备方面的方法积累。',
    'The same idea extends to closed systems. A target tensor-network state can admit multiple parent Hamiltonians. We exploit that freedom to optimize the gap along an adiabatic preparation path while preserving the target state, studying random 1D tensor-network states, AKLT and GHZ examples. I contributed to the optimization concept, theory and research design as a co-corresponding author. This connects with my sole-author 2022 work on dynamical quantum geometric tensors, although the two approaches use different optimization freedoms.',[papers.gap,papers.dynamic]);
  add('nonlocality',R,1.5,['量子非局域性：从检测到优化','Quantum nonlocality: from detection to optimization'],['成果线三 · 量子资源认证','Research III · Quantum-resource certification'],
    `${formula('R = β<sub>Q</sub> / β<sub>C</sub>','量子值与经典界的比值；采用论文约定。')}${cols(card('研究任务','优化 Bell 不等式的量子违背<br>关注置换不变多体情形与可计算结构'),card('结果与状态','研究局部最优违背与多面体面的联系<br>数值观察与解析结果分别陈述<br><span class="tag">arXiv:2511.07523 · 预印本</span>'))}${call('第一作者、共同通讯作者。量子资源的认证为未来优势检验提供工具。')}`,
    `${formula('R = β<sub>Q</sub> / β<sub>C</sub>','Ratio of the quantum value to the classical bound, under the paper’s convention.')}${cols(card('Task','Optimize quantum violations of Bell inequalities<br>Study permutation-invariant many-body scenarios'),card('Results & status','Relate locally optimal violations to polytope facets<br>Separate numerical observations from analytical results<br><span class="tag">arXiv:2511.07523 · Preprint</span>'))}${call('First and co-corresponding author. Resource certification supplies tools for future advantage tests.')}`,
    '量子信息方面，我研究 Bell 不等式量子违背的优化，重点包括置换不变多体场景。相关工作仍是预印本，我是第一作者和共同通讯作者。我们分析了量子与经典界之比的局部优化与多面体面的联系，其中“局部极大值通常对应面”的部分应明确说是数值观察，不能讲成已经证明的一般定理。这里的作用是展示我已有量子资源认证的方法积累。在未来学习模型中，认证了量子资源也不等于证明任务优势；还必须单独比较编码、制备、读取和完整资源成本。',
    'My quantum-information work optimizes Bell violations, including permutation-invariant many-body scenarios. The cited work remains a preprint; I am the first and co-corresponding author. We study the relationship between local optimization of the quantum-to-classical ratio and facets of a polytope. The statement that local maxima typically correspond to facets is a numerical observation, not a general theorem. Resource certification is useful for future learning models, but it must remain separate from a task-advantage test that includes encoding, preparation, readout and full resource costs.',[papers.bell]);
  add('research-summary',R,.5,['已有基础：界、协议与可验证动力学','Established foundations: bounds, protocols and verifiable dynamics'],['研究成果小结','Research synthesis'],
    `${cols(card('几何与代价界','有限时间过程的可计算约束<br>热机、分离与初始化'),card('控制与动力学设计','最优协议与谱隙优化<br>固定目标下改善过程'),card('涨落与量子认证','轨道统计、不可逆性<br>量子资源与多体结构'))}${call('下一步：把这些方法用于学习与生成过程，建立可检验的代价—速度—精度关系。')}`,
    `${cols(card('Geometry & cost bounds','Computable constraints on finite-time processes<br>Engines, separation and initialization'),card('Control & dynamics design','Optimal protocols and spectral optimization<br>Improve processes at fixed targets'),card('Fluctuations & certification','Trajectory statistics and irreversibility<br>Quantum resources and many-body structure'))}${call('Next: apply these methods to learning and generation, with testable cost–speed–accuracy relations.')}`,
    '前面的成果可以归纳为三类能力：建立代价界、构造最优协议、以及验证动力学与资源结构。这也是我选择下一阶段方向的依据。人工智能模型的学习和生成同样是有限时间过程，但是否存在合适的热力学描述需要研究，不能直接套用。下面的规划因此从可定义、可验证的小模型开始。',
    'The work supplies three capabilities: deriving cost bounds, constructing optimal protocols, and verifying dynamics and resource structure. These motivate the next agenda. Learning and generation are finite-time processes, but a valid thermodynamic description must be established rather than assumed. I therefore plan to begin with controlled, testable models.',[papers.membrane,papers.thermal,papers.gap]);
  add('ai-bridge',F,1,['科研规划：人工智能模型的随机热力学','Agenda: stochastic thermodynamics of AI models'],['拟开展研究','Proposed research'],
    `<p class="big-quote">学习与生成，能否建立<br>明确的代价—速度—精度关系？</p>${cols(card('为什么从物理出发','理解噪声、弛豫、记忆与不可逆性<br>寻找有明确条件的界与优化协议'),card('研究边界','先定义随机动力学与模型内代价<br>硬件电耗需要额外物理实现模型'))}${call('目标：建立自洽描述，提出可复现、可证伪的优化结果。')}`,
    `<p class="big-quote">Can learning and generation admit<br>explicit cost–speed–accuracy relations?</p>${cols(card('Why a physics approach?','Understand noise, relaxation, memory and irreversibility<br>Derive conditional bounds and protocols'),card('Scope','Define stochastic dynamics and model costs first<br>Hardware energy needs an additional realization model'))}${call('Goal: self-consistent descriptions and reproducible, falsifiable optimization results.')}`,
    '我希望未来以随机热力学与人工智能为主线。切入点不是先宣称人工智能一定是一台热机，而是问它在什么条件下具有自洽的随机动力学描述，以及这种描述能否给出可检验的代价速度精度关系。我已经在热力学几何、最优控制、谱隙和涨落统计上有积累，因此可以从这些具体工具出发。必须区分模型内代价、路径不可逆性与真实硬件电耗。只有额外建立物理实现和测量模型，才能讨论后者。规划中的三个方向分别解决描述、优化和量子拓展问题。',
    'My planned direction is stochastic thermodynamics at the interface with AI. I do not start by assuming that an AI model is a heat engine. I ask when a self-consistent stochastic description exists and whether it yields testable relations between cost, speed and accuracy. My foundations in geometry, optimal control, gaps and fluctuation statistics offer concrete tools. Model costs, path irreversibility and hardware energy are distinct; hardware claims require an additional physical realization and measurement model. The agenda covers description, optimization and quantum extensions.');
  add('ai-models',F,2,['方向一：建立可检验的随机动力学','Direction I: establish testable stochastic dynamics'],['从 Energy Transformer 与 Hopfield 模型开始','Start with Energy Transformer and Hopfield models'],
    `${cols(card('先明确模型','状态变量、迁移率、噪声协方差<br>控制参数、边界条件与稳态<br>区分推断状态与权重训练'),card('再检验热力学条件','噪声与动力学的相容性<br>稳态是否存在、是否为 Gibbs 分布<br>小批量噪声与优化器记忆的作用'))}${call('预期产出：明确适用条件的解析小模型、稳态检验与可复现基准。')}<p class="caption">不预设 SGD 噪声满足涨落耗散关系。</p>`,
    `${cols(card('Specify the model','State variables, mobility and noise covariance<br>Controls, boundaries and stationary state<br>Separate inference states from weight training'),card('Test thermodynamic conditions','Compatibility of noise and dynamics<br>Existence and Gibbs character of the stationary state<br>Mini-batch noise and optimizer memory'))}${call('Expected outputs: solvable models with explicit conditions, steady-state checks and reproducible benchmarks.')}<p class="caption">Do not assume that SGD noise satisfies a fluctuation–dissipation relation.</p>`,
    '第一条方向建立自洽模型。我计划从 Energy Transformer 和 Hopfield 等结构较明确的模型入手，逐一指定状态坐标、迁移率、噪声协方差、控制参数和边界条件。首先研究固定权重下的推断状态弛豫，再逐步研究权重和优化器状态。需要检查归一化、稳态存在性和 Gibbs 假设；不能因为方程长得像 Langevin 方程，就默认它是热平衡系统。对于训练，小批量采样噪声一般也不能直接等同热噪声。第一年的可完成目标是一组解析或高精度可检验的小模型，以及公开可复现的数值基准。如果模型不满足条件，这本身也能界定热力学描述的适用范围。',
    'Direction I establishes a self-consistent model. I plan to begin with Energy Transformer and Hopfield models and explicitly specify coordinates, mobility, noise covariance, controls and boundaries. Fixed-weight inference relaxation comes first, followed by weight and optimizer-state dynamics. Normalization, steady-state existence and Gibbs assumptions must be tested. A Langevin-like equation does not automatically describe thermal equilibrium, and mini-batch noise need not be thermal noise. A feasible first-year outcome is a set of analytically or numerically controlled models and reproducible benchmarks. Failure of the conditions would also define the limits of the thermodynamic description.');
  add('ai-optimization',F,2,['方向二：固定任务质量，优化有限时间过程','Direction II: optimize finite-time processes at fixed quality'],['几何、谱隙与随机控制相结合','Combine geometry, gap optimization and stochastic control'],
    `<div class="pathway"><span>固定任务与资源</span><span>定义误差与代价</span><span>优化协议</span><span>强基线检验</span></div>${cols(card('可用工具','近准静态区域：响应度量与热力学长度<br>固定目标：约束下的谱隙优化<br>远离平衡：随机与路径空间控制'),card('验证标准','相同质量、相同资源口径<br>同时比较收敛、累计代价与稳态误差<br>扩展到扩散模型检验正反过程'))}${call('有条件的界、可靠的数值改进与明确的失败边界，都属于有效结果。')}`,
    `<div class="pathway"><span>Fix task & resources</span><span>Define error & cost</span><span>Optimize protocols</span><span>Test strong baselines</span></div>${cols(card('Tools','Near quasistatic regimes: response metrics and thermodynamic length<br>Fixed targets: constrained gap optimization<br>Far from equilibrium: stochastic and path-space control'),card('Validation','Matched quality and resource accounting<br>Compare convergence, cumulative cost and stationary error<br>Test forward/reverse processes in diffusion models'))}${call('Conditional bounds, reliable numerical gains and clear failure regimes are all useful outcomes.')}`,
    '第二条方向从描述走向优化。比较前先固定任务、初态、目标分布、误差定义和生成元资源，避免把精度降低或者速率整体放大当成改进。在接近准静态且响应度量存在的区域，我希望用热力学长度寻找调度；对于固定目标分布的弛豫过程，研究受约束的谱隙优化；远离平衡或者度量不成立时，转向随机控制和路径空间方法。扩散模型可以用于检验正反过程与路径不可逆性。评价要同时看收敛时间、累计模型代价和稳态误差，并与强基线比较。这样，即使没有普遍改进，也可以形成清楚的适用条件和负结果。',
    'Direction II optimizes the process after defining it. Tasks, initial states, targets, errors and generator resources must be matched before comparison, ruling out lower accuracy or uniform rate rescaling as improvements. Thermodynamic length can guide schedules where a quasistatic response metric exists. Constrained gap optimization addresses fixed-target relaxation, while stochastic and path-space control handle regimes outside the geometric description. Diffusion models offer tests of forward/reverse processes and path irreversibility. Validation compares convergence time, accumulated model cost and stationary error against strong baselines, including scientifically informative negative results.');
  add('quantum-ai',F,1.5,['方向三：量子拓展与优势的严格检验','Direction III: quantum extensions and rigorous advantage tests'],['从可控的量子 Hopfield 模型开始','Begin with controlled quantum Hopfield models'],
    `${cols(card('量子资源认证','明确编码、态制备与读取方案<br>按模型选择纠缠、上下文性或 Bell 工具<br>检验资源的可观测性与鲁棒性'),card('任务优势检验','使用有竞争力的经典基线<br>计入制备、演化、测量与重复采样<br>比较相同精度下的完整资源'))}${call('资源存在 ≠ 任务优势。两类问题分别建模、分别验证。')}`,
    `${cols(card('Resource certification','Specify encoding, preparation and readout<br>Select entanglement, contextuality or Bell tools as applicable<br>Test observability and robustness'),card('Task-advantage test','Use competitive classical baselines<br>Count preparation, evolution, measurement and repeated sampling<br>Compare full resources at matched accuracy'))}${call('Resource presence ≠ task advantage. Model and test these questions separately.')}`,
    '第三条方向是量子拓展，但我把它放在经典基准和一致性研究之后。从可控的量子 Hopfield 模型开始，先把编码、制备、检索和读取写清楚，再分别讨论资源认证和任务优势。Bell 或纠缠工具可以证明使用了某种量子资源，但不能替代算法层面的成本比较。我计划使用有竞争力的经典基线，并计入态制备、测量和重复采样。可能的结果包括有限条件下的可证明优势、鲁棒的数值差异，或计入完整代价后没有优势。研究价值来自边界明确，而不是事先承诺普遍量子优势。',
    'Quantum extensions come after classical benchmarks and consistency analysis. Starting with controlled quantum Hopfield models, I will specify encoding, preparation, retrieval and readout, then separate resource certification from task advantage. Bell or entanglement tools can certify a resource but do not replace a full algorithmic cost comparison. Competitive classical baselines and costs of preparation, measurement and repeated sampling are essential. Possible outcomes include limited provable advantages, robust numerical differences, or no advantage with full accounting. The goal is an explicit boundary rather than a claim of universal quantum advantage.');
  add('roadmap',F,2,['从第一年可完成的问题逐步推进','A staged plan, starting with feasible first-year questions'],['五年科研路径','Five-year research roadmap'],
    `<div class="cols-3">${card('第 1 年','Energy Transformer / Hopfield 基准<br>随机嵌入的一致性条件<br>解析界、稳态与正反过程检验','建立基础')}${card('第 2—3 年','权重与优化器记忆动力学<br>约束下几何与谱隙优化<br>扩散模型验证与开源复现','形成方法')}${card('第 4—5 年','量子 Hopfield 拓展<br>资源认证与任务比较<br>经典—量子统一代价口径','检验拓展')}</div>${call('实施基础：理论与计算为主；工作站、共享 CPU/GPU 与存储。逐步开展研究生训练与合作。')}`,
    `<div class="cols-3">${card('Year 1','Energy Transformer / Hopfield benchmarks<br>Consistency conditions for stochastic embeddings<br>Bounds, stationary states and forward/reverse checks','Foundations')}${card('Years 2–3','Weight and optimizer-memory dynamics<br>Constrained geometric and gap optimization<br>Diffusion tests and open reproducibility','Methods')}${card('Years 4–5','Quantum Hopfield extensions<br>Resource certification and task comparisons<br>Common classical/quantum cost accounting','Extensions')}</div>${call('Implementation: theory and computation; a workstation, shared CPU/GPU and storage, with gradual student training and collaboration.')}`,
    '科研规划要落实到阶段性的可完成问题。第一年以 Energy Transformer 和 Hopfield 基准为主，目标是明确随机嵌入条件、建立可以核验的解析界和稳态检验，而不是立即承诺大型应用节能。第二到第三年引入权重和优化器记忆，研究几何与谱隙优化，并用扩散模型交叉检验；当度量不成立时采用随机控制。第四到第五年再展开量子模型的资源与任务比较。实施上以理论和计算为主，需要工作站和共享计算资源。学生训练可围绕小模型推导、数值验证和可复现代码逐步开展，具体规模根据学院条件安排。',
    'The first year focuses on Energy Transformer and Hopfield benchmarks: embedding conditions, checkable bounds and stationary-state tests. Years two and three add weight and optimizer memory, constrained geometry and gap optimization, and diffusion-model cross-checks; stochastic control is available where a metric fails. Years four and five extend to quantum models and resource-versus-task comparisons. The work is mainly theoretical and computational, using a workstation and shared compute resources. Student projects can develop from small-model derivations to numerical validation and reproducible code, with team scale determined by institutional arrangements.');
  add('closing',F,1.5,['建立可解释、可优化、可验证的动力学','Build interpretable, optimizable and verifiable dynamics'],['感谢各位老师 · 欢迎讨论','Thank you · Discussion welcome'],
    `${cols(card('已有成果','热力学几何与有限时间代价<br>最优控制与谱隙优化<br>涨落统计与量子认证'),card('未来问题','人工智能模型的一致性描述<br>固定质量下的有限时间优化<br>量子拓展的完整代价检验'))}<p class="big-quote closing-quote">从物理约束出发，<br>回答学习与生成过程的具体问题。</p>`,
    `${cols(card('Foundations','Thermodynamic geometry and finite-time costs<br>Optimal control and spectral optimization<br>Fluctuation statistics and quantum certification'),card('Next questions','Consistent descriptions of AI models<br>Finite-time optimization at fixed quality<br>Full-cost tests of quantum extensions'))}<p class="big-quote closing-quote">Use physical constraints to answer<br>concrete questions about learning and generation.</p>`,
    '最后，我希望各位老师记住两个相互联系的方面。已有研究是在具体物理系统里把有限时间代价、控制协议和谱隙问题做成可计算、可验证的结果，既有独著，也有第一作者与通讯作者的合作工作。未来研究将以随机热力学与人工智能为主线，从自洽小模型和固定质量的比较开始，再逐步走向量子拓展。我的目标是形成能够明确适用条件、能够重复验证、也允许被结果否定的研究体系。感谢各位老师，欢迎就科学问题、个人贡献和实施计划提出意见。',
    'I would like to leave two connected messages. My completed research turns finite-time costs, control protocols and spectral gaps into computable and verifiable results in specified physical systems, including independent work and first- or corresponding-author collaborations. My planned agenda focuses on stochastic thermodynamics and AI, beginning with consistent models and matched-quality comparisons before quantum extensions. I aim to develop research with explicit conditions, reproducible tests and conclusions that can be falsified. Thank you, and I welcome discussion of the science, contributions and implementation.',[home,scholar]);
  add('qa-independence',B,0,['问答：独立性与研究延续','Discussion: independence and continuity'],['备用 · 个人贡献','Backup · Individual contributions'],
    `${cols(card('如何体现研究独立性？','两篇独著：PRE 2022、PRR 2022<br>PRX Energy 2023 共同第一作者<br>PRE 2024、PRB 2026 第一作者及共同通讯'),card('未来研究与原合作方向的关系？','保留几何、控制、谱隙与涨落方法<br>以学习动力学的一致性与固定质量优化为独立问题<br>阶段性成果可由小团队逐步完成'))}${call('项目 12147157：展示项目经历；具体承担职责依原始记录确认。')}`,
    `${cols(card('Evidence of independence?','Two sole-author papers: PRE 2022 and PRR 2022<br>Co-first author: PRX Energy 2023<br>First/co-corresponding: PRE 2024 and PRB 2026'),card('Relation to previous collaborations?','Retain geometry, control, gap and fluctuation methods<br>Study learning-dynamics consistency and fixed-quality optimization<br>Staged questions can be pursued by a small team'))}${call('Project No. 12147157: listed as project experience; verify the exact role against original records.')}`,
    '回答独立性时先举独著，再说明一作与通讯作者工作中的具体贡献，避免只报论文数量。未来方向要用独立问题来表达：什么模型可以有自洽描述、在同质量同资源下什么优化真正有效。谈基金时只陈述核实的编号与主题；负责人和经费信息应以原始项目记录为准。',
    'Lead with sole-author work and then specify contributions to first- and corresponding-author papers. Frame the future agenda around independent questions: consistency conditions and genuine improvements with matched quality and resources. Grant leadership and budgets require the original records.',[papers.brownian,papers.dynamic,papers.thermal],true);
  add('qa-ai',B,0,['问答：热力学描述是否成立？','Discussion: is the thermodynamic description valid?'],['备用 · AI 研究的关键边界','Backup · Boundaries of the AI agenda'],
    `${cols(card('模型“能量”就是电耗吗？','不是。模型能量函数、统计不可逆性和物理散热分别定义；硬件能耗需物理实现与测量模型。'),card('SGD 能直接视为热噪声吗？','一般不能。需显式分析小批量噪声、状态依赖性、优化器记忆与稳态条件。'))}${call('如果 Gibbs / 度量假设不成立：报告失效条件，转向一般随机控制与路径概率。')}`,
    `${cols(card('Does model energy equal electricity use?','No. Model energy, statistical irreversibility and physical dissipation require separate definitions; hardware energy needs realization and measurement models.'),card('Is SGD noise thermal noise?','Not generally. Analyze mini-batch noise, state dependence, optimizer memory and stationary-state conditions explicitly.'))}${call('If Gibbs or metric assumptions fail: report the failure conditions and use general stochastic control or path probabilities.')}`,
    '这个备用页用于避免把跨学科规划讲得过满。可先解释模型层面的定义，再说明怎样检验。现阶段不声称已经证明人工智能节能，也不把任何随机优化器当作热浴。条件失败时仍然可以研究路径概率、不可逆性和控制问题，但结论要使用相应的模型语言。',
    'Use this slide to state definitions and tests before making cross-disciplinary claims. The agenda does not yet establish AI energy savings and does not treat arbitrary optimizers as thermal baths. When equilibrium assumptions fail, path probabilities and control remain possible, with model-appropriate conclusions.',[],true);
  add('qa-gap-quantum',B,0,['问答：怎样定义真正的改进？','Discussion: what counts as a genuine improvement?'],['备用 · 比较口径','Backup · Comparison criteria'],
    `${cols(card('谱隙增大就是收敛更快吗？','需同时指定初态、误差范数和目标误差。检查瞬态、非正规性与累计代价，固定生成元资源。'),card('有量子资源就是量子优势吗？','资源认证与任务优势分开。比较强经典基线并计入编码、制备、读取和重复采样。'))}${call('共同标准：相同任务、相同质量、完整资源口径、可复现实验。')}`,
    `${cols(card('Does a larger gap guarantee faster convergence?','Specify the initial state, norm and target error; test transients, non-normality and cumulative cost at fixed generator resources.'),card('Do quantum resources imply an advantage?','Separate resource certification from task advantage; count encoding, preparation, readout and repeated sampling against strong classical baselines.'))}${call('Shared criteria: matched task and quality, complete resource accounting and reproducible tests.')}`,
    '对改进的追问，先把比较条件列清楚，再给出具体结论。谱隙是一个量，但不是所有有限时间过程的完整评价。量子资源是一个性质，也不是计算性能的完整证明。把这些区分讲清楚，能够让规划更可信。',
    'When asked about improvement, state comparison conditions before the conclusion. A gap is one quantity, not a complete description of finite-time dynamics. A quantum resource is one property, not a full performance proof.',[papers.thermal,papers.bell],true);
  add('teaching',B,0,['教学基础与学生训练设想','Teaching background and student training'],['备用 · 教学与培养','Backup · Teaching & training'],
    `${cols(card('已有助教经历','高等量子力学 · 2017.09—2018.01<br>群论 · 2019.09—2020.01<br>北京计算科学研究中心研究生课程'),card('拟开展的训练','从随机过程、开放量子系统到数值方法<br>解析小模型 + 数值验证 + 文献讨论<br>以可复现代码和清晰贡献记录组织课题'))}${call('教学设想：结合物理推导与计算练习，帮助学生理解模型假设和结果的适用边界。')}`,
    `${cols(card('Teaching-assistant experience','Advanced Quantum Mechanics · Sep 2017–Jan 2018<br>Group Theory · Sep 2019–Jan 2020<br>Graduate courses at Beijing Computational Science Research Center'),card('Planned student training','Stochastic processes, open quantum systems and numerical methods<br>Analytical models, numerical checks and literature discussion<br>Reproducible code and explicit contribution records'))}${call('Teaching approach: combine physical derivations and computational exercises, emphasizing assumptions and validity.')}`,
    '教学部分基于真实助教经历，没有新增独立授课或指导学生的经历。可以介绍我希望如何将研究方法转化成学生训练：从可解析的小模型开始，理解随机过程和量子主方程，再加入数值计算与文献讨论。涉及课程承担时，根据学院需要安排，不把拟开课程写成已经开设。',
    'The teaching record is limited to the stated TA experience; there is no additional instructor-of-record or supervision claim. Planned training starts with tractable models, stochastic processes and quantum master equations, followed by computation and literature discussion. Proposed teaching should be coordinated with institutional needs.',[home],true);
  const list = (items,en=false) => `<div class="paper-list">${items.map(([name,role,paper])=>`<article><div><h3>${name}</h3><p>${role}</p></div><a href="${paper.url}" target="_blank" rel="noopener noreferrer">${paper.label}</a></article>`).join('')}</div>`;
  add('papers-thermo',B,0,['代表作索引 · 热力学与最优控制','Selected papers · Thermodynamics & optimal control'],['备用 · 论文与署名','Backup · Publications & authorship'],
    list([['热力学长度的有限时间测量外推','第一作者',papers.length],['等温捷径最小能耗的测地线路径','第二作者；Editors’ Suggestion',papers.geo],['有限时间膜分离的测地线能耗下界','共同第一作者',papers.membrane],['布朗热机的捷径优化','独著',papers.brownian],['布朗热机最大功率的最优控制理论','第一作者、共同通讯',papers.control]]),
    list([['Extrapolating the thermodynamic length with finite-time measurements','First author',papers.length],['Geodesic Path for the Minimal Energy Cost in Shortcuts to Isothermality','Second author; Editors’ Suggestion',papers.geo],['Geodesic Lower Bound of the Energy Consumption to Achieve Membrane Separation within Finite Time','Co-first author',papers.membrane],['Optimizing Brownian heat engine with shortcut strategy','Sole author',papers.brownian],['Optimal control theory for maximum power of Brownian heat engines','First and co-corresponding author',papers.control]]),
    '备用索引页。每条均可打开正式论文页面，必要时针对方法、适用条件和署名回答。',

  add('papers-manybody',B,0,['代表作索引 · 多体、涨落与量子信息','Selected papers · Many-body, fluctuations & quantum information'],['备用 · 论文与发表状态','Backup · Publications & status'],

  'use strict';

  const labels = {
    zh: {reportLabel:'科研面试报告',overview:'目录',overviewTitle:'报告目录',overviewHint:'选择任意一页，进入报告。',presentationMap:'报告脉络',notes:'讲稿',presenterOnly:'演讲者备注',notesHint:'按 N 显示或隐藏讲稿。备注不会出现在打印稿中。',rehearsal:'彩排计时',running:'计时中',paused:'已暂停',overtime:'已超过 40 分钟',next:'下一页',previous:'上一页',moveSlide:'切换页面',language:'语言',fullScreen:'全屏',close:'关闭',backup:'备用页',minutes:'分钟',source:'资料来源',startTimer:'开始计时',pauseTimer:'暂停计时',resetTimer:'重置计时',overviewTitleButton:'报告目录 (O)',notesTitle:'讲稿备注 (N)',languageTitle:'切换语言 (L)',fullScreenTitle:'全屏展示 (F)',exitFullScreen:'退出全屏 (F)',print:'打印 / 保存 PDF',closeNotes:'关闭讲稿',closeOverview:'关闭目录',presentationLabel:'科研报告',sectionsLabel:'报告章节',toolbarLabel:'报告工具',firstSlide:'返回第一页',noNotes:'本页暂无讲稿备注。',focusMode:'已开启专注展示。按 F 返回。',fullScreenUnavailable:'已开启专注展示。浏览器未允许全屏，可按 F 返回。',loadingError:'报告未能加载。请检查 assets/content.js 后刷新页面。',backupTime:'问答参考',linkHomepage:'个人主页',linkScholar:'Google 学术',slideAnnouncement:'第 {n} 页，共 {total} 页：{title}',pausedToast:'彩排计时已暂停',resetToast:'彩排计时已归零',timerFinished:'已到 40 分钟，可进入问答环节。'},
    en: {reportLabel:'Research interview',overview:'Overview',overviewTitle:'Presentation overview',overviewHint:'Select a slide to jump into the presentation.',presentationMap:'Presentation map',notes:'Notes',presenterOnly:'Presenter notes',notesHint:'Press N to show or hide notes. Notes are excluded from the print version.',rehearsal:'Rehearsal timer',running:'Running',paused:'Paused',overtime:'Over 40 minutes',next:'Next',previous:'Previous',moveSlide:'Navigate',language:'Language',fullScreen:'Full screen',close:'Close',backup:'Backup',minutes:'min',source:'Sources',startTimer:'Start timer',pauseTimer:'Pause timer',resetTimer:'Reset timer',overviewTitleButton:'Presentation overview (O)',notesTitle:'Presenter notes (N)',languageTitle:'Switch language (L)',fullScreenTitle:'Full screen (F)',exitFullScreen:'Exit full screen (F)',print:'Print / Save PDF',closeNotes:'Close notes',closeOverview:'Close overview',presentationLabel:'Research presentation',sectionsLabel:'Presentation sections',toolbarLabel:'Presentation tools',firstSlide:'Return to the first slide',noNotes:'No presenter notes for this slide.',focusMode:'Focus mode is on. Press F to return.',fullScreenUnavailable:'Focus mode is on. The browser did not permit full screen. Press F to return.',loadingError:'The presentation could not load. Check assets/content.js and refresh the page.',backupTime:'For discussion',linkHomepage:'Homepage',linkScholar:'Google Scholar',slideAnnouncement:'Slide {n} of {total}: {title}',pausedToast:'Rehearsal timer paused',resetToast:'Rehearsal timer reset',timerFinished:'40 minutes reached. You can move to questions.'}
  };
  const $ = id => document.getElementById(id);
  const state = {lang:'zh',index:0,notes:false,timerRunning:false,elapsed:0,timerStartedAt:0,timerNotice:false,focusMode:false};
  let report;
  let sections = [];
  let toastTimeout;
  let tickInterval;
  const totalSeconds = 40 * 60;
  const escapeHTML = text => String(text ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const tr = key => labels[state.lang][key] || key;
  const localized = value => typeof value === 'string' ? value : value?.[state.lang] ?? value?.zh ?? value?.en ?? '';
  const readStored = key => {try{return localStorage.getItem(key);}catch{return null;}};
  const storeValue = (key,value) => {try{localStorage.setItem(key,value);}catch{/* Presentation works without storage. */}};
  const sourceURL = value => {try{const url = new URL(value,location.href);return /^(https?:|mailto:)$/.test(url.protocol) ? url.href : '';}catch{return '';}};
  const digits = number => String(number).padStart(2,'0');
  const formatTime = seconds => `${digits(Math.floor(seconds / 60))}:${digits(Math.floor(seconds % 60))}`;
  const minutesLabel = slide => slide.backup ? tr('backupTime') : `${Number(slide.minutes) || 0} ${tr('minutes')}`;

  function toast(message) {
    clearTimeout(toastTimeout);
    $('toast').textContent = message;
    $('toast').hidden = false;
    toastTimeout = setTimeout(() => {$('toast').hidden = true;},4200);
  }

  function renderSlides() {
    $('slides').innerHTML = report.slides.map((slide,index) => {
      const sources = (slide.sources || []).map(source => {
        const url = sourceURL(source.url);
        return url ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(localized(source.label))}</a>` : '';
      }).join('');
      return `<article class="slide${index === 0 ? ' slide--first' : ''}${slide.backup ? ' slide--backup' : ''}" id="slide-${escapeHTML(slide.id || index + 1)}" data-slide-index="${index}" ${index !== state.index ? 'hidden' : ''} aria-labelledby="slide-title-${index}">
        <header class="slide-header"><div class="slide-topline"><span class="slide-kicker">${escapeHTML(localized(slide.kicker) || localized(slide.section))}</span>${slide.backup ? `<span class="backup-label">${tr('backup')}</span>` : ''}<span class="slide-index">${digits(index + 1)}</span></div><h1 id="slide-title-${index}">${escapeHTML(localized(slide.title))}</h1></header>
        <div class="slide-body">${localized(slide.html)}</div>
        <footer class="slide-footer"><div class="slide-sources" aria-label="${tr('source')}">${sources}</div><span class="slide-footer-number">${digits(index + 1)} / ${digits(report.slides.length)}</span></footer>
      </article>`;
    }).join('');
    updateSlide(false);
  }

  function buildSections() {
    sections = [];
    report.slides.forEach((slide,index) => {
      const key = `${localized(slide.section)}${slide.backup ? ':backup' : ''}`;
      const existing = sections.find(section => section.key === key);
      if(existing) existing.indices.push(index);
      else sections.push({key,label:localized(slide.section) || tr('overview'),start:index,indices:[index],backup:Boolean(slide.backup)});
    });
    $('section-rail').innerHTML = sections.map((section,index) => `<button type="button" class="rail-item" data-section-index="${index}" title="${escapeHTML(section.label)}" aria-label="${escapeHTML(section.label)}"><span class="rail-number">${section.backup ? '+' : digits(index + 1)}</span><span class="rail-label">${escapeHTML(section.label)}</span></button>`).join('');
    $('section-rail').querySelectorAll('button').forEach(button => button.addEventListener('click',() => navigate(sections[Number(button.dataset.sectionIndex)].start)));
    renderOverview();
  }

  function renderOverview() {
    $('overview-content').innerHTML = sections.map(section => `<section class="overview-group"><div class="overview-group-heading"><h3>${escapeHTML(section.label)}</h3>${section.backup ? `<span class="backup-label">${tr('backup')}</span>` : ''}</div><div class="overview-grid">${section.indices.map(index => {
      const slide = report.slides[index];
      return `<button type="button" class="overview-slide${index === state.index ? ' active' : ''}" data-target="${index}" ${index === state.index ? 'aria-current="step"' : ''}><span class="overview-slide-number">${digits(index + 1)}</span><span class="overview-slide-copy"><span class="overview-slide-title">${escapeHTML(localized(slide.title))}</span><span class="overview-slide-time">${escapeHTML(minutesLabel(slide))}</span></span></button>`;
    }).join('')}</div></section>`).join('');
    $('overview-content').querySelectorAll('button').forEach(button => button.addEventListener('click',() => {navigate(Number(button.dataset.target));closeOverview();}));
  }

  function updateSlide(animate = true) {
    const slide = report.slides[state.index];
    $('slides').querySelectorAll('.slide').forEach((element,index) => {
      element.hidden = index !== state.index;
      element.classList.remove('enter');
      if(index === state.index){element.scrollTop = 0;if(animate) {void element.offsetWidth;element.classList.add('enter');}}
    });
    $('presentation').scrollTop = 0;
    $('slide-section').textContent = localized(slide.section);
    $('slide-number').textContent = `${digits(state.index + 1)} / ${digits(report.slides.length)}`;
    $('slide-minutes').textContent = minutesLabel(slide);
    $('prev-button').disabled = state.index === 0;
    $('next-button').disabled = state.index === report.slides.length - 1;
    $('deck-progress-value').style.width = `${((state.index + 1) / report.slides.length) * 100}%`;
    $('section-rail').querySelectorAll('button').forEach((button,index) => {
      const active = sections[index].indices.includes(state.index);
      button.classList.toggle('active',active);
      if(active)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');
    });
    $('overview-content').querySelectorAll('button[data-target]').forEach(button => {
      const active = Number(button.dataset.target) === state.index;
      button.classList.toggle('active',active);
      if(active)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');
    });
    renderNotes();
    $('announcement').textContent = tr('slideAnnouncement').replace('{n}',state.index + 1).replace('{total}',report.slides.length).replace('{title}',localized(slide.title));
    document.title = `${localized(slide.title)} · ${localized(report.profile?.name) || tr('reportLabel')}`;
  }

  function navigate(index,{updateHash = true} = {}) {
    const nextIndex = Math.max(0,Math.min(report.slides.length - 1,index));
    if(!Number.isFinite(nextIndex))return;
    state.index = nextIndex;
    updateSlide();
    if(updateHash){const id = report.slides[state.index].id || state.index + 1;try{history.replaceState(null,'',`#${encodeURIComponent(id)}`);}catch{/* Local files may restrict history access. */}}
  }

  function hashIndex() {
    let id = '';
    try{id = decodeURIComponent(location.hash.slice(1));}catch{id = location.hash.slice(1);}
    const index = report.slides.findIndex((slide,index) => String(slide.id || index + 1) === id);
    return index >= 0 ? index : 0;
  }

  function renderNotes() {
    const slide = report.slides[state.index];
    $('notes-title').textContent = `${digits(state.index + 1)} — ${localized(slide.title)}`;
    const notes = localized(slide.notes);
    $('notes-content').textContent = notes || tr('noNotes');
  }

  function setNotes(open) {
    state.notes = open;
    $('notes-panel').hidden = !open;
    document.body.classList.toggle('notes-open',open);
    $('notes-toggle').setAttribute('aria-expanded',String(open));
    if(!open && $('notes-panel').contains(document.activeElement)) $('notes-toggle').focus();
  }

  function openOverview() {
    if(typeof $('overview-dialog').showModal === 'function') $('overview-dialog').showModal();
    else { $('overview-dialog').setAttribute('open',''); $('overview-dialog').style.display = 'block'; }
    requestAnimationFrame(() => {const current = $('overview-content').querySelector('.active');if(current){current.scrollIntoView({block:'nearest'});current.focus({preventScroll:true});}});
  }
  function closeOverview() {
    if(typeof $('overview-dialog').close === 'function')$('overview-dialog').close();
    else{$('overview-dialog').removeAttribute('open');$('overview-dialog').style.display = '';}
    $('overview-toggle').focus({preventScroll:true});
  }

  function applyLanguage() {
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(element => {element.textContent = tr(element.dataset.i18n);});
    $('profile-name').textContent = localized(report.profile?.name) || tr('reportLabel');
    $('profile-subtitle').textContent = localized(report.profile?.subtitle);
    $('identity').setAttribute('aria-label',tr('firstSlide'));
    $('presentation').setAttribute('aria-label',tr('presentationLabel'));
    $('section-rail').setAttribute('aria-label',tr('sectionsLabel'));
    document.querySelector('.toolbar').setAttribute('aria-label',tr('toolbarLabel'));
    $('notes-panel').setAttribute('aria-label',tr('notesTitle'));
    $('language-toggle').querySelector('.language-current').textContent = state.lang === 'zh' ? '中文' : 'EN';
    $('language-toggle').querySelector('.language-target').textContent = state.lang === 'zh' ? 'EN' : '中文';
    const attributes = {'overview-toggle':'overviewTitleButton','notes-toggle':'notesTitle','language-toggle':'languageTitle','print-button':'print','notes-close':'closeNotes','overview-close':'closeOverview','timer-reset':'resetTimer','prev-button':'previous','next-button':'next'};
    Object.entries(attributes).forEach(([id,key]) => {$(id).title = tr(key);$(id).setAttribute('aria-label',tr(key));});
    $('prev-button').title = `${tr('previous')} (←)`;
    $('next-button').title = `${tr('next')} (→)`;
    updateFullscreenLabel();
    buildSections();
    renderSlides();
    updateTimer();
  }

  function changeLanguage() {state.lang = state.lang === 'zh' ? 'en' : 'zh';storeValue('research-presentation-language',state.lang);applyLanguage();}

  function elapsedSeconds() {return state.elapsed + (state.timerRunning ? (performance.now() - state.timerStartedAt) / 1000 : 0);}
  function updateTimer() {
    const seconds = elapsedSeconds();
    $('timer-value').textContent = formatTime(seconds);
    $('time-progress-value').style.width = `${Math.min(100,seconds / totalSeconds * 100)}%`;
    document.querySelector('.rehearsal').classList.toggle('over-time',seconds >= totalSeconds);
    $('timer-status').textContent = seconds >= totalSeconds ? tr('overtime') : state.timerRunning ? tr('running') : seconds > 0 ? tr('paused') : tr('rehearsal');
    $('timer-toggle').setAttribute('aria-label',tr(state.timerRunning ? 'pauseTimer' : 'startTimer'));
    $('timer-toggle').title = tr(state.timerRunning ? 'pauseTimer' : 'startTimer');
    $('timer-icon').innerHTML = state.timerRunning ? '<path d="M8 5v14M16 5v14"/>' : '<path d="m9 5 11 7-11 7z"/>';
    if(seconds >= totalSeconds && !state.timerNotice){state.timerNotice = true;toast(tr('timerFinished'));}
  }
  function toggleTimer() {
    if(state.timerRunning){state.elapsed = elapsedSeconds();state.timerRunning = false;clearInterval(tickInterval);}
    else{state.timerStartedAt = performance.now();state.timerRunning = true;tickInterval = setInterval(updateTimer,250);}
    updateTimer();
  }
  function resetTimer() {clearInterval(tickInterval);state.timerRunning = false;state.elapsed = 0;state.timerNotice = false;updateTimer();toast(tr('resetToast'));}

  function updateFullscreenLabel() {
    const active = Boolean(document.fullscreenElement || state.focusMode);
    $('fullscreen-toggle').title = tr(active ? 'exitFullScreen' : 'fullScreenTitle');
    $('fullscreen-toggle').setAttribute('aria-label',tr(active ? 'exitFullScreen' : 'fullScreen'));
    $('fullscreen-toggle').setAttribute('aria-pressed',String(active));
  }
  async function toggleFullscreen() {
    if(document.fullscreenElement){try{await document.exitFullscreen();}catch{/* Focus mode remains available. */}state.focusMode = false;document.body.classList.remove('focus-mode');}
    else if(state.focusMode){state.focusMode = false;document.body.classList.remove('focus-mode');}
    else {
      state.focusMode = true;document.body.classList.add('focus-mode');
      if(document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen();}catch{toast(tr('fullScreenUnavailable'));}}
      else toast(tr('focusMode'));
    }
    updateFullscreenLabel();
  }

  function bindEvents() {
    $('identity').addEventListener('click',event => {event.preventDefault();navigate(0);});
    $('prev-button').addEventListener('click',() => navigate(state.index - 1));
    $('next-button').addEventListener('click',() => navigate(state.index + 1));
    $('language-toggle').addEventListener('click',changeLanguage);
    $('notes-toggle').addEventListener('click',() => setNotes(!state.notes));
    $('notes-close').addEventListener('click',() => setNotes(false));
    $('overview-toggle').addEventListener('click',openOverview);
    $('overview-close').addEventListener('click',closeOverview);
    $('overview-dialog').addEventListener('click',event => {if(event.target === $('overview-dialog')){const rect = $('overview-dialog').getBoundingClientRect();if(event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)closeOverview();}});
    $('fullscreen-toggle').addEventListener('click',toggleFullscreen);
    $('print-button').addEventListener('click',() => window.print());
    $('timer-toggle').addEventListener('click',toggleTimer);
    $('timer-reset').addEventListener('click',resetTimer);
    window.addEventListener('hashchange',() => navigate(hashIndex(),{updateHash:false}));
    document.addEventListener('fullscreenchange',() => {if(!document.fullscreenElement){state.focusMode = false;document.body.classList.remove('focus-mode');}updateFullscreenLabel();});
    document.addEventListener('keydown',event => {
      if(event.ctrlKey || event.altKey || event.metaKey || event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
      if($('overview-dialog').open){if(event.key.toLowerCase() === 'l'){event.preventDefault();changeLanguage();}return;}
      if(event.target.closest('button,a') && (event.key === ' ' || event.key === 'Enter'))return;
      const key = event.key.toLowerCase();
      if(['arrowright','arrowdown','pagedown',' '].includes(key)){event.preventDefault();navigate(state.index + 1);}
      else if(['arrowleft','arrowup','pageup'].includes(key)){event.preventDefault();navigate(state.index - 1);}
      else if(key === 'home'){event.preventDefault();navigate(0);}
      else if(key === 'end'){event.preventDefault();navigate(report.slides.length - 1);}
      else if(key === 'n'){event.preventDefault();setNotes(!state.notes);}
      else if(key === 'l'){event.preventDefault();changeLanguage();}
      else if(key === 'f'){event.preventDefault();toggleFullscreen();}
      else if(key === 'o'){event.preventDefault();openOverview();}
      else if(key === 'escape'){if(state.notes)setNotes(false);else if(state.focusMode && !document.fullscreenElement)toggleFullscreen();}
    });
    let touch = null;
    $('presentation').addEventListener('touchstart',event => {
      if(event.touches.length !== 1 || event.target.closest('a,button,input,textarea,select,[contenteditable]')){touch = null;return;}
      const point = event.touches[0];touch = {x:point.clientX,y:point.clientY,time:performance.now()};
    },{passive:true});
    $('presentation').addEventListener('touchend',event => {
      if(!touch || event.changedTouches.length !== 1)return;
      const point = event.changedTouches[0];const dx = point.clientX - touch.x;const dy = point.clientY - touch.y;const duration = performance.now() - touch.time;
      if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.7 && duration < 650)navigate(state.index + (dx < 0 ? 1 : -1));
      touch = null;
    },{passive:true});
    $('presentation').addEventListener('touchcancel',() => {touch = null;},{passive:true});
  }

  function initialize() {
    report = window.REPORT;
    if(!report || !Array.isArray(report.slides) || report.slides.length === 0){$('slides').innerHTML = `<div class="loading-state"><p>${escapeHTML(tr('loadingError'))}</p></div>`;return;}
    const savedLanguage = readStored('research-presentation-language');
    if(savedLanguage === 'zh' || savedLanguage === 'en')state.lang = savedLanguage;
    state.index = hashIndex();
    applyLanguage();
    bindEvents();
  }
  initialize();
})();
</script></body>
</html>
